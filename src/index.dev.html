  const t = (x) => {

    if (x < 1e9) return t(Math.floor(x / 1e6)) + ' juta ' + t(x % 1e6);
    if (x < 1e12) return t(Math.floor(x / 1e9)) + ' miliar ' + t(x % 1e9);

    const A = Math.PI * D * D / 4;
    const v = A > 0 ? Q / A : 0;
    const hf = (Q > 0 && D > 0) ? 10.67 * L * Math.pow(Q, 1.852) / (Math.pow(C, 1.852) * Math.pow(D, 4.87)) : 0;
    head[id] = head[parent[id]] - hf;
    let status = 'ok';
    if (Q <= 0) status = 'idle'; else if (v < s.vMin) status = 'low'; else if (v > s.vMax) status = 'high';
    pipeRes[pid] = { length: L, Q: cumQ[id], v, hf, hfkm: L > 0 ? hf / L * 1000 : 0, C, status, up: parent[id], down: id, inTree: true };
  });
  pipes.forEach(p => {
    if (!pipeRes[p.id]) pipeRes[p.id] = { length: lengths[p.id], Q: 0, v: 0, hf: 0, hfkm: 0, C: MATERIALS[p.material]?.C || 130, status: 'idle', up: p.from, down: p.to, inTree: false, isLoop: visited.has(p.from) && visited.has(p.to) };
  });
  const nodeRes = {};
  nodes.forEach(n => {
    if (!visited.has(n.id)) { nodeRes[n.id] = { head: null, pressure: null, status: 'iso', cumQ: 0, dist: null }; return; }
    const P = head[n.id] - (+n.elev || 0);
    let status = 'ok';
    if (n.type === 'reservoir') status = 'src';
    else if (P < 0) status = 'neg'; else if (P < s.pMin) status = 'low'; else if (P > s.pMax) status = 'hp';
    nodeRes[n.id] = { head: head[n.id], pressure: P, status, cumQ: cumQ[n.id], dist: depth[n.id], source: source[n.id], parent: parent[n.id], parentPipe: parentPipe[n.id] };
  });

  // Peringatan + rekomendasi
  const warnings = [];
  if (!nodes.some(n => n.type === 'reservoir') && nodes.length) warnings.push({ level: 'high', text: 'Jaringan belum memiliki Reservoir/Sumber. Tambahkan node bertipe Reservoir agar aliran dapat dihitung.' });
  nodes.forEach(n => {
    const r = nodeRes[n.id];
    if (r.status === 'iso') warnings.push({ level: 'idle', ref: n.id, text: `Node ${n.label} tidak terhubung ke reservoir mana pun.` });
    if (r.status === 'neg') warnings.push({ level: 'high', ref: n.id, text: `Tekanan negatif di ${n.label} (${fmt(r.pressure)} mka): air tidak sampai. Perbesar diameter pipa di hulunya atau naikkan muka air reservoir.` });
    else if (r.status === 'low') warnings.push({ level: 'low', ref: n.id, text: `Sisa tekanan ${n.label} hanya ${fmt(r.pressure)} mka (< ${s.pMin} mka).` });
    else if (r.status === 'hp') warnings.push({ level: 'hp', ref: n.id, text: `Tekanan ${n.label} ${fmt(r.pressure)} mka melebihi ${s.pMax} mka. Pertimbangkan Bak Pelepas Tekan (BPT) atau PRV.` });
  });
  pipes.forEach(p => {
    const r = pipeRes[p.id];
    if (r.isLoop) warnings.push({ level: 'idle', ref: p.id, text: `Pipa ${p.label} membentuk loop. Mesin ini menghitung jaringan bercabang, jadi pipa loop dianggap tanpa aliran.` });
    if (r.status === 'high') {
      const rec = DIAMETERS.find(d => d > p.diameter && (r.Q / 1000) / (Math.PI * (d / 1000) ** 2 / 4) <= s.vMax);
      warnings.push({ level: 'high', ref: p.id, text: `Kecepatan ${p.label} ${fmt(r.v)} m/s > ${s.vMax} m/s (risiko gerusan & water hammer).${rec ? ` Saran: perbesar ke Ø${rec} mm.` : ''}` });
    } else if (r.status === 'low') {
      const rec = [...DIAMETERS].reverse().find(d => d < p.diameter && (r.Q / 1000) / (Math.PI * (d / 1000) ** 2 / 4) >= s.vMin);
      warnings.push({ level: 'low', ref: p.id, text: `Kecepatan ${p.label} ${fmt(r.v)} m/s < ${s.vMin} m/s (potensi endapan).${rec ? ` Saran: perkecil ke Ø${rec} mm atau sediakan wash out.` : ' Sediakan wash out untuk penggelontoran berkala.'}` });
    }
  });
  const totalDemand = nodes.filter(n => n.type !== 'reservoir').reduce((a, n) => a + Math.max(0, +n.demand || 0), 0);
  const totalLength = Object.values(lengths).reduce((a, b) => a + b, 0);
  const pressured = nodes.filter(n => nodeRes[n.id].pressure !== null && n.type !== 'reservoir');
  const minP = pressured.reduce((m, n) => (!m || nodeRes[n.id].pressure < nodeRes[m.id].pressure) ? n : m, null);
  const maxV = pipes.reduce((m, p) => (!m || pipeRes[p.id].v > pipeRes[m.id].v) ? p : m, null);
  return { nodes: nodeRes, pipes: pipeRes, warnings, totalDemand, totalLength, minP, maxV, order };
}

// Jalur dari sumber ke node akhir (untuk potongan memanjang & profil HGL)
function buildPath(project, hyd, endId) {
  const nmap = Object.fromEntries(project.nodes.map(n => [n.id, n]));
  const pmap = Object.fromEntries(project.pipes.map(p => [p.id, p]));
  let end = endId && hyd.nodes[endId] && hyd.nodes[endId].dist !== null ? endId : null;
  if (!end) {
    let best = -1;
    project.nodes.forEach(n => { const d = hyd.nodes[n.id].dist; if (d !== null && d !== undefined && d > best) { best = d; end = n.id; } });
  }
  if (!end) return null;
  const chain = []; let cur = end;
  while (cur !== undefined) { chain.unshift(cur); cur = hyd.nodes[cur].parent; }
  if (chain.length < 2) return null;
  const points = []; const segments = []; let dist = 0;
  chain.forEach((id, i) => {
    if (i > 0) {
      const pid = hyd.nodes[id].parentPipe; const L = hyd.pipes[pid].length;
      segments.push({ pipe: pmap[pid], res: hyd.pipes[pid], start: dist, end: dist + L });
      dist += L;
    }
    points.push({ node: nmap[id], dist, ground: +nmap[id].elev || 0, head: hyd.nodes[id].head, pressure: hyd.nodes[id].pressure });
  });
  return { points, segments, total: dist, endId: end };
}
function buildStations(path, interval) {
  const st = path.points.map(p => ({ ...p, isNode: true }));
  if (interval > 0) {
    path.segments.forEach((sg, i) => {
      const a = path.points[i], b = path.points[i + 1];
      for (let d = Math.ceil((sg.start + 0.01) / interval) * interval; d < sg.end - 0.5; d += interval) {
        const t = (d - sg.start) / (sg.end - sg.start || 1);
        const ground = a.ground + (b.ground - a.ground) * t; const head = a.head + (b.head - a.head) * t;
        st.push({ dist: d, ground, head, pressure: head - ground, isNode: false });
      }
    });
  }
  return st.sort((x, y) => x.dist - y.dist);
}

const r500 = (v) => Math.round(v / 500) * 500;
function defPipePrice(mat, d) {
  if (mat === 'HDPE') return r500(9000 + 145000 * Math.pow(d / 110, 1.7));
  if (mat === 'GIP') return r500(30000 + 420000 * Math.pow(d / 100, 1.4));
  return r500(7500 + 88000 * Math.pow(d / 110, 1.7));
}
const FITTING_DEF = {
  tee:     { name: 'Tee (fitting percabangan)',              price: d => r500(35000 + 95000 * Math.pow(d / 110, 1.6)) },
  bend:    { name: 'Bend / Elbow',                           price: d => r500(30000 + 78000 * Math.pow(d / 110, 1.6)) },
  reducer: { name: 'Reducer',                                price: d => r500(25000 + 62000 * Math.pow(d / 110, 1.6)) },
  endcap:  { name: 'End cap / dop',                          price: d => r500(15000 + 50000 * Math.pow(d / 110, 1.6)) },
  gv:      { name: 'Gate Valve (flange, lengkap)',           price: d => r500(275000 + 1250000 * Math.pow(d / 110, 1.5)) },

  box:     { name: 'Box pengaman katup (pas. bata + tutup)', price: () => 850000 },
  thrust:  { name: 'Thrust block beton K-175',               price: d => r500(450000 + 600000 * Math.pow(d / 110, 1.5)) },
};
function bendClass(defl) { return defl <= 16.9 ? 11.25 : defl <= 33.75 ? 22.5 : defl <= 67.5 ? 45 : 90; }

function computeBoQ(project, hyd) {
  const s = project.settings; const waste = 1 + (+s.wastePct || 0) / 100;
  const nmap = Object.fromEntries(project.nodes.map(n => [n.id, n]));
  const proj = makeProjector(centroid(project.nodes).lat, centroid(project.nodes).lng);
  // Rekap pipa per jenis & diameter
  const gmap = {};
  project.pipes.forEach(p => {
    const k = p.material + '|' + p.diameter;
    gmap[k] = gmap[k] || { key: k, material: p.material, diameter: +p.diameter, length: 0, pipes: [] };
    gmap[k].length += hyd.pipes[p.id]?.length || 0; gmap[k].pipes.push(p.label);
  });
  const W = +s.trenchWidth, H = +s.trenchDepth, bed = +s.sandBed, cov = +s.sandCover;
  const pipeGroups = Object.values(gmap).sort((a, b) => a.material.localeCompare(b.material) || b.diameter - a.diameter).map(g => {
    const D = g.diameter / 1000, L = g.length, area = Math.PI * D * D / 4;
    const sandZone = Math.min(H, bed + D + cov);
    const galian = W * H * L;
    const pasir = Math.max(0, W * sandZone * L - area * L);
    const kembali = Math.max(0, W * (H - sandZone) * L);
    return { ...g, lengthTotal: g.length * waste, galian, pasir, kembali, perM: { galian: W * H, pasir: Math.max(0, W * sandZone - area), kembali: Math.max(0, W * (H - sandZone)) } };
  });
  const earth = pipeGroups.reduce((a, g) => ({ galian: a.galian + g.galian, pasir: a.pasir + g.pasir, kembali: a.kembali + g.kembali }), { galian: 0, pasir: 0, kembali: 0 });
  const totalLength = pipeGroups.reduce((a, g) => a + g.length, 0);

  // Aksesoris dari node
  const fits = {};
  const add = (kind, d, node, extra = '', qty = 1) => {
    const key = `fit|${kind}|${d}${extra ? '|' + extra : ''}`;
    if (!fits[key]) {
      const def = FITTING_DEF[kind];
      let desc = def.name + (d ? ` Ø${d} mm` : '');
      if (kind === 'bend') desc = `Bend ${extra}° Ø${d} mm`;
      if (kind === 'reducer') desc = `Reducer Ø${d} × Ø${extra} mm`;
      fits[key] = { key, kind, desc, qty: 0, unit: kind === 'thrust' ? 'unit' : (kind === 'hu' || kind === 'box' || kind === 'wo' ? 'unit' : 'bh'), def: def.price(d || 110), nodes: [] };
    }
    fits[key].qty += qty; if (node && !fits[key].nodes.includes(node.label)) fits[key].nodes.push(node.label);
  };
  const thrust = (d, node) => add('thrust', d >= 150 ? 150 : d >= 90 ? 90 : 50, node);
  const conn = Object.fromEntries(project.nodes.map(n => [n.id, []]));
  project.pipes.forEach(p => { if (conn[p.from] && conn[p.to]) { conn[p.from].push({ p, other: p.to }); conn[p.to].push({ p, other: p.from }); } });
  const huLinked = new Set((project.structures || []).filter(x => x.type === 'hidran' && x.nodeId).map(x => x.nodeId));
  const counts = { tee: 0, bend: 0, reducer: 0, endcap: 0, gv: 0, av: 0, wo: 0, hu: 0, thrust: 0, box: 0 };
  project.nodes.forEach(n => {
    const c = conn[n.id]; const deg = c.length; if (!deg) return;
    const dias = c.map(x => +x.p.diameter); const dMax = Math.max(...dias), dMin = Math.min(...dias);
    if (n.type === 'reservoir') return;
    if (deg >= 3) { add('tee', dMax, n, '', deg - 2); counts.tee += deg - 2; thrust(dMax, n); counts.thrust++; }
    if (deg >= 2 && dMax !== dMin) { add('reducer', dMax, n, String(dMin)); counts.reducer++; }
    if (deg === 2) {
      const a = proj.toXY(nmap[c[0].other].lat, nmap[c[0].other].lng), b = proj.toXY(nmap[c[1].other].lat, nmap[c[1].other].lng), o = proj.toXY(n.lat, n.lng);
      const v1 = { x: a.x - o.x, y: a.y - o.y }, v2 = { x: b.x - o.x, y: b.y - o.y };
      const cos = (v1.x * v2.x + v1.y * v2.y) / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1);
      const defl = 180 - Math.acos(clamp(cos, -1, 1)) * 180 / Math.PI;
      if (n.type === 'bend' || defl >= s.bendAngle) { add('bend', dMax, n, String(bendClass(defl))); counts.bend++; thrust(dMax, n); counts.thrust++; }
    }
    if (n.type === 'gate_valve') { add('gv', dMax, n); counts.gv++; add('box', 0, n); counts.box++; thrust(dMax, n); counts.thrust++; }
    if (n.type === 'air_valve') { add('av', dMax, n); counts.av++; add('box', 0, n); counts.box++; if (deg >= 2) { add('tee', dMax, n); counts.tee++; } }
    if (n.type === 'wash_out') { add('wo', dMax, n); counts.wo++; add('box', 0, n); counts.box++; if (deg >= 2) { add('tee', dMax, n); counts.tee++; } }
    if (n.type === 'hydrant') { if (!huLinked.has(n.id)) add('hu', 0, n); counts.hu++; if (deg >= 2) { add('tee', dMax, n); counts.tee++; } }
    if (deg === 1 && !['hydrant', 'wash_out'].includes(n.type)) { add('endcap', dMax, n); counts.endcap++; }
    if (deg === 1) { thrust(dMax, n); counts.thrust++; }
  });

  const fittings = Object.values(fits).sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || a.key.localeCompare(b.key));
  fittings.forEach(f => { if (f.kind === 'thrust') f.desc = `Thrust block beton K-175 (pipa ${f.key.split('|')[2] === '150' ? '≥ Ø150' : f.key.split('|')[2] === '90' ? 'Ø90–Ø140' : '< Ø90'} mm)`; if (f.kind === 'box' || f.kind === 'hu') f.desc = FITTING_DEF[f.kind].name; });
  const structures = (project.structures || []).map(st => { const g = structGeom(st, project); const q = structQty(g, hyd.totalDemand); return { st, g, q, items: structItems(st, g, q) }; });
  return { pipeGroups, earth, totalLength, fittings, counts, waste, structures };
}

function buildRAB(project, boq) {
  const P = project.prices || {};
  const it = (key, desc, vol, unit, def) => { const v = round2(vol); const price = P[key] !== undefined ? +P[key] : def; return { key, desc, vol: v, unit, price, def, amount: v * price }; };
  const L = boq.totalLength;
  const sections = [
    { code: 'I', title: 'PEKERJAAN PERSIAPAN', items: [
      it('mob', 'Mobilisasi dan demobilisasi peralatan & tenaga kerja', 1, 'ls', 7500000),
      it('survey', 'Pengukuran, uitzet trase dan pemasangan bowplank', L, "m'", 3500),
      it('board', 'Papan nama proyek', 1, 'bh', 750000),
      it('k3', 'Penerapan SMKK (Sistem Manajemen Keselamatan Konstruksi)', 1, 'ls', 3500000),
    ]},
    { code: 'II', title: 'PEKERJAAN TANAH', items: [
      it('dig', 'Galian tanah biasa untuk jalur pipa', boq.earth.galian, 'm³', 95000),
      it('sand', 'Urugan pasir alas dan penutup pipa, dipadatkan', boq.earth.pasir, 'm³', 285000),
      it('backfill', 'Urugan tanah kembali, dipadatkan per lapis 20 cm', boq.earth.kembali, 'm³', 48000),
    ]},
    { code: 'III', title: 'PENGADAAN & PEMASANGAN PIPA', items: boq.pipeGroups.map(g =>
      it(`pipe|${g.material}|${g.diameter}`, `Pipa ${MATERIALS[g.material].label} Ø${g.diameter} mm (termasuk waste ${project.settings.wastePct}%)`, g.lengthTotal, "m'", defPipePrice(g.material, g.diameter))) },
    { code: 'IV', title: 'AKSESORIS & FITTING JARINGAN', items: boq.fittings.map(f => ({ ...it(f.key, f.desc, f.qty, f.unit, f.def), nodes: f.nodes })) },
    { code: 'V', title: 'PENGUJIAN & PENYELESAIAN', items: [
      it('test', 'Uji tekanan hidrostatis jaringan pipa', L, "m'", 4000),
      it('flush', 'Flushing dan desinfeksi jaringan pipa', L, "m'", 2500),
      it('asbuilt', 'Dokumentasi dan gambar purna laksana (as built drawing)', 1, 'ls', 2500000),
    ]},
  ];
  boq.structures.forEach((x, i) => sections.push({ code: roman(6 + i), structId: x.st.id,
    title: `BANGUNAN ${x.st.label}: ${STRUCT_TYPES[x.st.type].label.toUpperCase()}`, items: x.items.map(([key, desc, vol, unit, def]) => it(key, desc, vol, unit, def)) }));
  sections.forEach(s => s.subtotal = s.items.reduce((a, i) => a + i.amount, 0));
  const total = sections.reduce((a, s) => a + s.subtotal, 0);
  const ppn = total * (+project.settings.ppnPct || 0) / 100;
  const grand = total + ppn;
  const rounded = Math.floor(grand / 1000) * 1000;
  return { sections, total, ppn, grand, rounded };
}

// Geometri parametris. Sumbu: x sepanjang P (dinding L kiri → R kanan), y sepanjang L (dinding K belakang → F depan), z = 0 di lantai dalam.
function structGeom(st, project) {

  let mh = clamp(+p.mh || 0.6, 0.3, Math.min(L, B) - 0.1);
  const Hin = Hw + fb, ov = 0.1, Lo = L + 2 * tw, Bo = B + 2 * tw, Htot = tb + Hin + tr;
  const D = d => (+d || 0) / 1000;
  const pipes = [], parts = []; let filter = null, weep = false, float = false, vent = false, ladder = false;
  let mhX = 0.12 + mh / 2, cutY = B / 2, cutX = L * 0.62;
  const std = () => {

function CanvasMap(props) {
  const { project, hyd, selection, activeNode, tool, colorMode, showLabels, fitSignal } = props;
  const svgRef = useRef(null);
  const originRef = useRef(null);
  if (!originRef.current) originRef.current = centroid(project.nodes);
  const P = useMemo(() => makeProjector(originRef.current.lat, originRef.current.lng), []);
  const fitView = () => {
    const pts = project.nodes.map(n => P.toXY(n.lat, n.lng));
    if (!pts.length) return { x: -400, y: -300, w: 800, h: 600 };
    const xs = pts.map(p => p.x), ys = pts.map(p => -p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = Math.max(200, (maxX - minX) * 1.4), h = Math.max(150, (maxY - minY) * 1.4);
    return { x: (minX + maxX) / 2 - w / 2, y: (minY + maxY) / 2 - h / 2, w, h };
  };
  const [view, setView] = useState(fitView);
  const [hover, setHover] = useState(null);
  useEffect(() => { if (fitSignal) setView(fitView()); }, [fitSignal]);
  const drag = useRef(null);
  const toWorld = (e) => { const svg = svgRef.current; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: r.x, y: r.y }; };
  useEffect(() => {
    const svg = svgRef.current;
    const onWheel = (e) => { e.preventDefault(); const w = toWorld(e); const k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      setView(v => ({ x: w.x - (w.x - v.x) * k, y: w.y - (w.y - v.y) * k, w: v.w * k, h: v.h * k })); };
    svg.addEventListener('wheel', onWheel, { passive: false });
    return () => svg.removeEventListener('wheel', onWheel);
  }, []);
  const onDown = (e, nodeId) => { e.stopPropagation(); svgRef.current.setPointerCapture(e.pointerId); drag.current = { nodeId, start: toWorld(e), sx: e.clientX, sy: e.clientY, moved: false, view0: view }; };
  const onMove = (e) => {
    const w = toWorld(e); setHover(w); const d = drag.current; if (!d) return;
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 4) d.moved = true;
    if (!d.moved) return;
    if (d.nodeId && tool === 'select') { d.pos = w; setHover({ ...w, dragging: d.nodeId }); }
    else if (!d.nodeId) { const r = svgRef.current.getBoundingClientRect(); const k = d.view0.w / r.width; setView({ ...d.view0, x: d.view0.x - (e.clientX - d.sx) * k, y: d.view0.y - (e.clientY - d.sy) * k }); }
  };
  const onUp = (e) => {
    const d = drag.current; drag.current = null; if (!d) return;
    if (!d.moved) { if (d.nodeId) props.onNodeClick(d.nodeId); else { const ll = P.toLL(d.start.x, -d.start.y); props.onMapClick(ll); } }
    else if (d.nodeId && tool === 'select' && d.pos) { props.onNodeDrag(d.nodeId, P.toLL(d.pos.x, -d.pos.y)); setHover(null); }
  };
  const xy = (n) => { if (hover?.dragging === n.id) return { x: hover.x, y: hover.y }; const p = P.toXY(n.lat, n.lng); return { x: p.x, y: -p.y }; };
  const nmap = Object.fromEntries(project.nodes.map(n => [n.id, n]));
  const u = view.w / 900; // ukuran 1 px layar dalam meter (perkiraan)
  const grid = niceStep(view.w / 8);
  const gl = [];
  for (let gx = Math.floor(view.x / grid) * grid; gx < view.x + view.w; gx += grid) gl.push(<line key={'gx' + gx} x1={gx} x2={gx} y1={view.y} y2={view.y + view.h} stroke="#c9d6d3" strokeWidth={u} />);
  for (let gy = Math.floor(view.y / grid) * grid; gy < view.y + view.h; gy += grid) gl.push(<line key={'gy' + gy} y1={gy} y2={gy} x1={view.x} x2={view.x + view.w} stroke="#c9d6d3" strokeWidth={u} />);
  const act = activeNode && nmap[activeNode];
  return <div className="absolute inset-0 bg-[#f4f7f6]">
    <svg ref={svgRef} className="w-full h-full touch-none select-none" viewBox={`${view.x} ${view.y} ${view.w} ${view.h}`} preserveAspectRatio="xMidYMid meet"
      onPointerDown={e => onDown(e, null)} onPointerMove={onMove} onPointerUp={onUp} style={{ cursor: tool === 'select' ? 'grab' : tool === 'delete' ? 'not-allowed' : 'crosshair' }}>
      <rect x={view.x} y={view.y} width={view.w} height={view.h} fill="#f4f7f6" />
      {gl}
      {project.pipes.map(p => {
        const a = nmap[p.from], b = nmap[p.to]; if (!a || !b) return null; const A = xy(a), B = xy(b); const r = hyd.pipes[p.id];
        const st = colorMode === 'velocity' ? r.status : (hyd.nodes[r.down]?.status || 'iso');
        const sel = selection?.kind === 'pipe' && selection.id === p.id;
        return <g key={p.id} onPointerDown={e => { e.stopPropagation(); }} onClick={e => { e.stopPropagation(); props.onPipeClick(p.id); }} style={{ cursor: 'pointer' }}>
          <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="transparent" strokeWidth={u * 14} />
          {sel && <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="#f97316" strokeWidth={u * 10} strokeLinecap="round" opacity={0.5} />}
          <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={STATUS_COLORS[st === 'src' ? 'ok' : st]} strokeWidth={u * (3 + Math.min(6, p.diameter / 40))} strokeLinecap="round" />
          {showLabels && <text x={(A.x + B.x) / 2} y={(A.y + B.y) / 2 - u * 8} fontSize={u * 11} textAnchor="middle" fill="#10232a" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" fontFamily="IBM Plex Mono, monospace">{p.label} Ø{p.diameter} · {fmt(r.length, 0)} m</text>}
        </g>;
      })}
      {(props.tracks || []).map(t => t.points.length > 1 && <polyline key={t.id} points={t.points.map(q => { const p = P.toXY(q[0], q[1]); return `${p.x},${-p.y}`; }).join(' ')} fill="none" stroke="#f97316" strokeWidth={u * 3} strokeDasharray={`${u} ${u * 6}`} strokeLinecap="round" pointerEvents="none" />)}
      {(project.structures || []).filter(st => !st.nodeId && st.lat != null).map(st => { const q = P.toXY(st.lat, st.lng); const sel = selection?.kind === 'struct' && selection.id === st.id;
        return <g key={st.id} onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); props.onStructClick(st.id); }} style={{ cursor: 'pointer' }}>
          <rect x={q.x - u * 16} y={-q.y - u * 10} width={u * 32} height={u * 20} rx={u * 3} fill="#3730a3" stroke={sel ? '#f97316' : '#fff'} strokeWidth={u * (sel ? 4 : 2)} />
          <text x={q.x} y={-q.y + u * 3.5} fontSize={u * 9} textAnchor="middle" fontWeight={700} fill="#fff" fontFamily="IBM Plex Mono, monospace" pointerEvents="none">{STRUCT_TYPES[st.type].short}</text>
          {showLabels && <text x={q.x + u * 20} y={-q.y + u * 4} fontSize={u * 11} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" pointerEvents="none">{st.label}</text>}</g>; })}
      {props.gpsPos && (() => { const q = P.toXY(props.gpsPos.lat, props.gpsPos.lng); return <g pointerEvents="none"><circle cx={q.x} cy={-q.y} r={props.gpsPos.acc || 10} fill="#3b82f6" opacity={0.12} /><circle cx={q.x} cy={-q.y} r={u * 8} fill="#2563eb" stroke="#fff" strokeWidth={u * 3} /></g>; })()}
      {act && tool === 'draw' && hover && <line x1={xy(act).x} y1={xy(act).y} x2={hover.x} y2={hover.y} stroke="#f97316" strokeWidth={u * 2.5} strokeDasharray={`${u * 6} ${u * 6}`} pointerEvents="none" />}
      {project.nodes.map(n => {
        const p = xy(n); const r = hyd.nodes[n.id]; const sel = selection?.kind === 'node' && selection.id === n.id;
        const color = n.type === 'reservoir' ? '#0b6e74' : STATUS_COLORS[r.status];
        return <g key={n.id} onPointerDown={e => onDown(e, n.id)} style={{ cursor: 'pointer' }}>
          {(sel || activeNode === n.id) && <circle cx={p.x} cy={p.y} r={u * 17} fill="none" stroke="#f97316" strokeWidth={u * 3} />}
          {n.type === 'reservoir'
            ? <rect x={p.x - u * 11} y={p.y - u * 11} width={u * 22} height={u * 22} rx={u * 3} fill="#0b6e74" stroke="#fff" strokeWidth={u * 2.5} />
            : <circle cx={p.x} cy={p.y} r={u * 11} fill="#fff" stroke={color} strokeWidth={u * 3.5} />}
          <text x={p.x} y={p.y + u * 3.5} fontSize={u * 9} textAnchor="middle" fontWeight={700} fill={n.type === 'reservoir' ? '#fff' : '#10232a'} fontFamily="IBM Plex Mono, monospace" pointerEvents="none">{NODE_TYPES[n.type].short}</text>
          {showLabels && <text x={p.x + u * 15} y={p.y + u * 4} fontSize={u * 11} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" pointerEvents="none">{n.label}{r.pressure !== null && n.type !== 'reservoir' ? ` · ${fmt(r.pressure, 1)} mka` : ''}</text>}
        </g>;
      })}
    </svg>
    <div className="absolute bottom-2 left-2 bg-white/90 border border-line rounded px-2 py-1 text-[11px] text-slate-600 num">Kanvas koordinat lokal · grid {fmt(grid, 0)} m · scroll untuk zoom, seret untuk geser</div>
  </div>;
}

function ElevBadge({ src }) {

function CoordField({ id, lat, lng, onChange, placeholder }) {

            className={`flex flex-col items-center justify-center gap-0.5 rounded-md border px-0.5 py-1.5 min-h-[50px] disabled:opacity-40 ${k.startsWith('st:') ? 'border-indigo-200 bg-indigo-50 hover:border-indigo-400 text-indigo-900' : 'border-line hover:border-aqua-400 text-ink'}`}>

      </div>
      <div className="border-t border-line pt-2">
        <button type="button" className="flex items-center gap-1 font-semibold text-slate-600" onClick={() => setShowSet(v => !v)}><Icon name="Settings2" size={14} />Pengaturan GPS & elevasi</button>
        {showSet && <div className="grid grid-cols-2 gap-2 mt-2">
          <div className="col-span-2"><Field label="Sumber elevasi otomatis" hint={s.elevSource === 'gps' ? 'Altitude GPS + koreksi geoid. Akurasi vertikal GPS ponsel umumnya ±5–15 m.' : s.elevSource === 'dem' ? 'DEM Copernicus 90 m via Open-Meteo (butuh internet). Akurasi ±2–10 m.' : 'Elevasi node baru diperkirakan dari node sekitar.'}>
            <select id="set-elevsrc" className="tp-field" value={s.elevSource} onChange={e => setS('elevSource', e.target.value)}><option value="dem">DEM online (otomatis)</option><option value="gps">Altitude GPS</option><option value="off">Manual saja</option></select></Field></div>

          <Field label="Toleransi belokan (m)"><NumField id="set-tol" value={s.autoTol} step="1" min="1" onChange={v => setS('autoTol', Math.max(1, v))} /></Field>

          <div className="col-span-2"><Btn variant="outline" icon="RotateCcw" className="w-full justify-center" onClick={() => setProject(p => ({ ...p,
            nodes: p.nodes.map(n => ({ ...n, elevAuto: true, elevKey: null })), structures: (p.structures || []).map(x => x.nodeId || x.lat == null ? x : { ...x, elevAuto: true, elevKey: null }) }))}>Ambil ulang elevasi semua titik dari DEM</Btn></div>
        </div>}
      </div>
      <div className="border-t border-line pt-2 flex flex-wrap items-center gap-1.5">
        <span className="text-slate-500 flex-1 min-w-[110px]">{nTracks} jejak · {nTrackPts} titik</span>
        <Btn variant="outline" icon="Upload" onClick={onOpenImport}>Impor GPX</Btn>
        <Btn variant="outline" icon="Download" onClick={() => downloadText((project.meta.name || 'proyek').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 50) + '.gpx', buildGpx(project), 'application/gpx+xml')}>Ekspor GPX</Btn>
        {nTracks > 0 && !rec && <Btn variant="ghost" icon="Trash2" title="Hapus semua jejak" onClick={() => setProject(p => ({ ...p, tracks: [] }))} />}
      </div>
    </div>
  </div>;
}

function MapWorkspace({ project, setProject, hyd, selection, setSelection, field }) {
  const { prefs, setPrefs, activeNode, setActiveNode, createPoint } = field;
  const [tool, setTool] = useState('select');
  const [colorMode, setColorMode] = useState('velocity');
  const [showLabels, setShowLabels] = useState(true);
  const [engine, setEngine] = useState(window.L ? 'leaflet' : 'canvas');
  const [fitSignal, setFitSignal] = useState(0);
  const [listTab, setListTab] = useState('nodes');
  const [cursor, setCursor] = useState(null);
  const newType = prefs.type; const placingStruct = newType.startsWith('st:');
  const makePipe = (p, from, to) => ({ id: uid('p'), label: nextLabel(p.pipes, 'P'), from, to, material: prefs.material, diameter: prefs.diameter });
  const pipeExists = (p, a, b) => p.pipes.some(x => (x.from === a && x.to === b) || (x.from === b && x.to === a));

  const onMapClick = (ll) => {
    if ((tool === 'node' || tool === 'draw') && placingStruct) { const id = createPoint(ll, newType, {}); setSelection({ kind: 'struct', id }); return; }
    if (tool === 'node') { const id = createPoint(ll, newType, { connect: false, chain: false }); setSelection({ kind: 'node', id }); }
    else if (tool === 'draw') { const kind = activeNode ? newType : (project.nodes.some(n => n.type === 'reservoir') ? newType : 'reservoir'); const id = createPoint(ll, kind, { connect: true }); setSelection({ kind: 'node', id }); }
    else if (tool === 'select') setSelection(null);
  };
  const onNodeClick = (id) => {
    if (tool === 'delete') { deleteNode(id); return; }
    if (tool === 'draw' && !placingStruct) {
      if (activeNode && activeNode !== id) setProject(p => pipeExists(p, activeNode, id) ? p : { ...p, pipes: [...p.pipes, makePipe(p, activeNode, id)] });
      setActiveNode(id);
    }
    setSelection({ kind: 'node', id });
  };
  const onPipeClick = (id) => { if (tool === 'delete') { deletePipe(id); return; } setSelection({ kind: 'pipe', id }); };
  const onStructClick = (id) => { if (tool === 'delete') { deleteStruct(id); return; } setSelection({ kind: 'struct', id }); };
  const onNodeDrag = (id, ll) => setProject(p => ({ ...p, nodes: p.nodes.map(n => n.id === id ? { ...n, lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7) } : n) }));
  const onStructDrag = (id, ll) => setProject(p => ({ ...p, structures: p.structures.map(x => x.id === id ? { ...x, lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7) } : x) }));
  const deleteNode = (id) => { setProject(p => ({ ...p, nodes: p.nodes.filter(n => n.id !== id), pipes: p.pipes.filter(x => x.from !== id && x.to !== id) })); if (activeNode === id) setActiveNode(null); setSelection(null); };
  const deletePipe = (id) => { setProject(p => ({ ...p, pipes: p.pipes.filter(x => x.id !== id) })); setSelection(null); };
  const deleteStruct = (id) => { setProject(p => ({ ...p, structures: p.structures.filter(x => x.id !== id), ded: p.ded.sheet === 'st:' + id ? { ...p.ded, sheet: 'layout' } : p.ded })); setSelection(null); };
  const splitPipe = (id) => {
    const pipe = project.pipes.find(x => x.id === id); const a = project.nodes.find(n => n.id === pipe.from), b = project.nodes.find(n => n.id === pipe.to);
    const created = { id: uid('n'), label: nextLabel(project.nodes, 'J'), type: 'junction', lat: +((a.lat + b.lat) / 2).toFixed(7), lng: +((a.lng + b.lng) / 2).toFixed(7), elev: round2((+a.elev + +b.elev) / 2), elevAuto: project.settings.elevSource !== 'off', elevSrc: 'est', demand: 0, waterLevel: 0 };
    const p1 = { ...pipe, to: created.id };
    const p2 = { ...pipe, id: uid('p'), label: nextLabel(project.pipes, 'P'), from: created.id };
    setProject(p => ({ ...p, nodes: [...p.nodes, created], pipes: [...p.pipes.map(x => x.id === id ? p1 : x), p2] }));
    setSelection({ kind: 'node', id: created.id });
  };
  const updNode = (id, patch) => setProject(p => ({ ...p, nodes: p.nodes.map(n => n.id === id ? { ...n, ...patch } : n) }));
  const updPipe = (id, patch) => setProject(p => ({ ...p, pipes: p.pipes.map(x => x.id === id ? { ...x, ...patch } : x) }));

  useEffect(() => {
    const onKey = (e) => {

/* =====================================================================
   10. WORKSPACE 2: ANALISIS HIDROLIS
   ===================================================================== */
function NetworkSchematic({ project, hyd, mode = 'velocity', height = 360, onSelect }) {
  const pts = useMemo(() => { const c = centroid(project.nodes); const P = makeProjector(c.lat, c.lng); return Object.fromEntries(project.nodes.map(n => { const q = P.toXY(n.lat, n.lng); return [n.id, { x: q.x, y: -q.y }]; })); }, [project.nodes]);
  const arr = Object.values(pts); if (!arr.length) return <div className="text-sm text-slate-500 p-6">Belum ada jaringan.</div>;
  const minX = Math.min(...arr.map(p => p.x)), maxX = Math.max(...arr.map(p => p.x)), minY = Math.min(...arr.map(p => p.y)), maxY = Math.max(...arr.map(p => p.y));
  const w = Math.max(100, maxX - minX), h = Math.max(80, maxY - minY); const pad = Math.max(w, h) * 0.14; const u = Math.max((w + pad * 2) / 820, (h + pad * 2) / height);
  return <svg viewBox={`${minX - pad} ${minY - pad} ${w + pad * 2} ${h + pad * 2}`} style={{ width: '100%', height }} className="block">
    {project.pipes.map(p => { const a = pts[p.from], b = pts[p.to]; if (!a || !b) return null; const r = hyd.pipes[p.id];
      const st = mode === 'velocity' ? r.status : (hyd.nodes[r.down]?.status || 'iso'); const col = STATUS_COLORS[st === 'src' ? 'ok' : st];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; const ll = Math.hypot(b.x - a.x, b.y - a.y) || 1; let nx = -(b.y - a.y) / ll, ny = (b.x - a.x) / ll; if (nx > 0) { nx = -nx; ny = -ny; }
      return <g key={p.id} onClick={() => onSelect && onSelect({ kind: 'pipe', id: p.id })} style={{ cursor: 'pointer' }}>
        <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={col} strokeWidth={u * (4 + p.diameter / 30)} strokeLinecap="round" />
        <text x={mx + nx * u * 9} y={my + ny * u * 9 + u * 4} fontSize={u * 11} textAnchor="end" fill="#10232a" stroke="#fff" strokeWidth={u * 4} paintOrder="stroke" fontFamily="IBM Plex Mono, monospace">{p.label} · {mode === 'velocity' ? fmt(r.v) + ' m/s' : 'Ø' + p.diameter}</text>
      </g>; })}
    {project.nodes.map(n => { const p = pts[n.id]; const r = hyd.nodes[n.id]; const col = n.type === 'reservoir' ? '#0b6e74' : STATUS_COLORS[r.status];
      return <g key={n.id} onClick={() => onSelect && onSelect({ kind: 'node', id: n.id })} style={{ cursor: 'pointer' }}>
        {n.type === 'reservoir' ? <rect x={p.x - u * 10} y={p.y - u * 10} width={u * 20} height={u * 20} fill={col} stroke="#fff" strokeWidth={u * 2} rx={u * 2} />
          : <circle cx={p.x} cy={p.y} r={u * 9} fill="#fff" stroke={col} strokeWidth={u * 4} />}
        <text x={p.x + u * 14} y={p.y + u * 4} fontSize={u * 12.5} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 4} paintOrder="stroke">{n.label}{n.type !== 'reservoir' && r.pressure !== null ? ` · ${fmt(r.pressure, 1)} mka` : n.type === 'reservoir' ? ` · HWL ${fmt(r.head, 1)}` : ''}</text>
      </g>; })}
  </svg>;
}
function ProfileChart({ path, settings, height = 260 }) {
  if (!path) return <div className="text-sm text-slate-500 p-6">Profil belum tersedia (butuh reservoir dan minimal satu pipa).</div>;
  const W = 760, H = height, m = { l: 56, r: 16, t: 16, b: 34 };
  const els = path.points.flatMap(p => [p.ground, p.head, p.ground + (settings.pMin || 0)]);
  const lo = Math.floor(Math.min(...els) - 5), hi = Math.ceil(Math.max(...els) + 5);
  const x = d => m.l + (d / (path.total || 1)) * (W - m.l - m.r); const y = e => m.t + (hi - e) / (hi - lo) * (H - m.t - m.b);
  const step = niceStep((hi - lo) / 5); const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(t);
  const ground = path.points.map(p => `${x(p.dist)},${y(p.ground)}`).join(' ');
  const hgl = path.points.map(p => `${x(p.dist)},${y(p.head)}`).join(' ');
  const minLine = path.points.map(p => `${x(p.dist)},${y(p.ground + settings.pMin)}`).join(' ');
  return <svg viewBox={`0 0 ${W} ${H}`} className="w-full block" role="img" aria-label="Profil garis tekanan">
    {ticks.map(t => <g key={t}><line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke="#e2e8e6" /><text x={m.l - 6} y={y(t) + 4} fontSize={11} textAnchor="end" fill="#64748b" className="num">{fmt(t, 0)}</text></g>)}
    <polygon points={`${x(0)},${H - m.b} ${ground} ${x(path.total)},${H - m.b}`} fill="#e9e1d3" />
    <polyline points={ground} fill="none" stroke="#7c5c2e" strokeWidth={2} />
    <polyline points={minLine} fill="none" stroke="#eab308" strokeWidth={1.2} strokeDasharray="5 4" />
    <polyline points={hgl} fill="none" stroke="#0b6e74" strokeWidth={2.4} />
    {path.points.map((p, i) => <g key={i}>
      <line x1={x(p.dist)} x2={x(p.dist)} y1={y(p.head)} y2={y(p.ground)} stroke={STATUS_COLORS[p.pressure < 0 ? 'neg' : p.pressure < settings.pMin && i > 0 ? 'low' : 'ok']} strokeWidth={1.5} strokeDasharray="2 2" />
      <circle cx={x(p.dist)} cy={y(p.head)} r={3.5} fill="#0b6e74" />
      <text x={x(p.dist)} y={H - m.b + 14} fontSize={11} textAnchor="middle" fontWeight={600} fill="#10232a">{p.node.label}</text>
      <text x={x(p.dist)} y={H - m.b + 27} fontSize={10} textAnchor="middle" fill="#64748b" className="num">{sta(p.dist)}</text>
      {i > 0 && <text x={x(p.dist) + 4} y={(y(p.head) + y(p.ground)) / 2} fontSize={10.5} fill="#0a585d" fontWeight={600} className="num">{fmt(p.pressure, 1)}</text>}
    </g>)}
    <text x={12} y={m.t + 4} fontSize={10.5} fill="#64748b" transform={`rotate(-90 12 ${m.t + 4})`} textAnchor="end">Elevasi (mdpl)</text>
  </svg>;
}
function HydraulicWorkspace({ project, setProject, hyd, setSelection, goMap }) {

        <ul className="divide-y divide-line max-h-[420px] overflow-y-auto">

function CrossSectionMini({ s, d }) {
  const W = s.trenchWidth, H = s.trenchDepth, bed = s.sandBed, cov = s.sandCover, D = d / 1000;
  const k = Math.min(150 / (W + 0.8), 100 / (H + 0.1)); const cx = 110, gy = 18;
  const X = v => cx + v * k, Y = v => gy + v * k;
  const sz = Math.min(H, bed + D + cov);
  return <g fontFamily="IBM Plex Sans, sans-serif">
    <rect x={0} y={gy} width={220} height={130 - gy} fill="#d9cbb1" />
    <rect x={X(-W / 2)} y={Y(0)} width={W * k} height={(H - sz) * k} fill="#b49a6e" />
    <rect x={X(-W / 2)} y={Y(H - sz)} width={W * k} height={sz * k} fill="#f3e3a6" />
    <circle cx={cx} cy={Y(H - bed - D / 2)} r={Math.max(2, D / 2 * k)} fill="#0b6e74" />
    <line x1={0} x2={220} y1={gy} y2={gy} stroke="#5b4421" strokeWidth={1.2} />
    <text x={cx} y={gy - 5} fontSize={8} textAnchor="middle" fill="#10232a">W = {fmt(W, 2)} m</text>
    <text x={X(W / 2) + 4} y={Y(H / 2)} fontSize={8} fill="#10232a">H = {fmt(H, 2)} m</text>
    <text x={X(-W / 2) - 4} y={Y(H - bed / 2) + 3} fontSize={7} textAnchor="end" fill="#10232a">alas {fmt(bed, 2)}</text>
    <text x={X(-W / 2) - 4} y={Y(H - sz) + 6} fontSize={7} textAnchor="end" fill="#10232a">pasir</text>
  </g>;
}

function SheetLayout({ project, hyd }) {
  const rowsPer = 13; const pipes = project.pipes; const cols = Math.min(2, Math.max(1, Math.ceil(pipes.length / rowsPer)));
  const tableH = 12 + Math.min(rowsPer, Math.max(1, pipes.length)) * 4.2; const ty = FRAME.y1 - tableH - 2;
  const area = { x: 22, y: 14, w: 304, h: ty - 8 - 14 };
  const nodes = project.nodes; const c = centroid(nodes); const P = makeProjector(c.lat, c.lng);
  const pts = Object.fromEntries(nodes.map(n => [n.id, P.toXY(n.lat, n.lng)]));
  const arr = Object.values(pts);
  const ex = arr.length ? Math.max(1, Math.max(...arr.map(p => p.x)) - Math.min(...arr.map(p => p.x))) : 100;
  const ey = arr.length ? Math.max(1, Math.max(...arr.map(p => p.y)) - Math.min(...arr.map(p => p.y))) : 100;
  const S = STD_SCALES.find(s => ex * 1000 / s <= area.w - 70 && ey * 1000 / s <= area.h - 26) || 100000;
  const k = 1000 / S; const midX = arr.length ? (Math.max(...arr.map(p => p.x)) + Math.min(...arr.map(p => p.x))) / 2 : 0, midY = arr.length ? (Math.max(...arr.map(p => p.y)) + Math.min(...arr.map(p => p.y))) / 2 : 0;
  const X = p => area.x + area.w / 2 + (p.x - midX) * k, Y = p => area.y + area.h / 2 - (p.y - midY) * k;
  const nmap = Object.fromEntries(nodes.map(n => [n.id, n]));
  const nodeAngle = (n) => { const ps = project.pipes.filter(p => p.from === n.id || p.to === n.id); if (!ps.length) return 0; const p = ps[0]; const a = pts[p.from], b = pts[p.to]; return -Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; };
  // skala grafis
  const barLen = niceStep((area.w * 0.25) / k); const barMm = barLen * k;
  // tabel pipa
  const tw = (area.w) / cols;
  const labelSide = (n) => { const ps = project.pipes.filter(p => p.from === n.id || p.to === n.id); let vx = 0, vy = 0;
    ps.forEach(p => { const o = pts[p.from === n.id ? p.to : p.from], m = pts[n.id]; if (!o) return; const dx = o.x - m.x, dy = -(o.y - m.y); const l = Math.hypot(dx, dy) || 1; vx += dx / l; vy += dy / l; });
    return { right: vx <= 0.05, down: vy < 0 }; };
  const heads = [['No', 0.07], ['Segmen', 0.17], ['Jenis', 0.13], ['Ø (mm)', 0.11], ['L (m)', 0.14], ['Q (L/dt)', 0.13], ['v (m/s)', 0.12], ['hf (m)', 0.13]];
  return <Sheet meta={project.meta} title="DENAH SKEMA JARINGAN PIPA DISTRIBUSI" scaleText={fmtScale(S)} sheetNo={1} sheetTotal={3 + (project.structures || []).length} legend={LayoutLegend}>
    <text x={area.x} y={area.y + 3} fontSize={3.2} fontWeight={700}>DENAH JARINGAN (LAYOUT PLAN)</text>
    <text x={area.x} y={area.y + 7} fontSize={2} fill="#333">Skala {fmtScale(S)} · Referensi koordinat pusat {c.lat.toFixed(5)}°, {c.lng.toFixed(5)}° (WGS 84)</text>
    {/* Panah utara */}
    <g transform={`translate(${area.x + area.w - 10},${area.y + 12})`}><circle r={6} fill="none" stroke="#000" strokeWidth={0.3} /><path d="M0 -5.2 L2.2 2.8 L0 1.4 Z" fill="#000" /><path d="M0 -5.2 L-2.2 2.8 L0 1.4 Z" fill="#fff" stroke="#000" strokeWidth={0.2} /><text y={-7} fontSize={2.8} fontWeight={700} textAnchor="middle">U</text></g>
    {/* Pipa */}
    {pipes.map(p => { const a = pts[p.from], b = pts[p.to]; if (!a || !b) return null; const r = hyd.pipes[p.id];
      const x1 = X(a), y1 = Y(a), x2 = X(b), y2 = Y(b); let ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; const len = Math.hypot(x2 - x1, y2 - y1);

        <g transform={`translate(${mx},${my}) rotate(${ang})`}>

          <text y={3.1} fontSize={len > 40 ? 1.9 : 1.6} textAnchor="middle">L = {fmt(r.length, 1)} m</text>

      </g>; })}
    {/* Skala grafis */}
    <g transform={`translate(${area.x + 2},${area.y + area.h - 6})`} fontSize={1.8}>

    </g>

    <text x={area.x} y={ty + 1} fontSize={2.4} fontWeight={700}>TABEL DATA SEGMEN PIPA</text>
    {Array.from({ length: cols }).map((_, ci) => { const x0 = area.x + ci * tw; const rows = pipes.slice(ci * rowsPer, (ci + 1) * rowsPer); let cx = x0; const cw = heads.map(h => h[1] * (tw - 4));
      return <g key={ci} fontSize={1.85}>

        {heads.map((h, i) => { const xx = cx; cx += cw[i]; return <g key={i}><text x={xx + cw[i] / 2} y={ty + 6.3} textAnchor="middle" fontWeight={700}>{h[0]}</text>{i > 0 && <line x1={xx} x2={xx} y1={ty + 3} y2={ty + 7.6 + rows.length * 4.2} stroke="#000" strokeWidth={0.2} />}</g>; })}
        {rows.map((p, ri) => { const r = hyd.pipes[p.id]; const y = ty + 7.6 + ri * 4.2; const vals = [ci * rowsPer + ri + 1, `${p.label} (${nmap[p.from]?.label}–${nmap[p.to]?.label})`, p.material, p.diameter, fmt(r.length, 2), fmt(r.Q, 2), fmt(r.v, 2), fmt(r.hf, 2)]; let xx = x0;
          return <g key={p.id}><rect x={x0} y={y} width={tw - 4} height={4.2} fill="none" stroke="#000" strokeWidth={0.2} />{vals.map((v, i) => { const t = <text key={i} x={xx + cw[i] / 2} y={y + 3} textAnchor="middle">{v}</text>; xx += cw[i]; return t; })}</g>; })}

  </Sheet>;

    <rect x={X(W / 2)} y={Y(0)} width={ext * k} height={(H + 0.12) * k} fill="url(#pat-soil)" />
    <rect x={X(-W / 2)} y={Y(H)} width={W * k} height={0.12 * k} fill="url(#pat-soil)" />
    {/* isi galian */}
    <rect x={X(-W / 2)} y={Y(0)} width={W * k} height={(H - sz) * k} fill="url(#pat-backfill)" stroke="none" />
    <rect x={X(-W / 2)} y={Y(H - sz)} width={W * k} height={sz * k} fill="#fff6d6" />
    <rect x={X(-W / 2)} y={Y(H - sz)} width={W * k} height={sz * k} fill="url(#pat-sand)" />
    <line x1={X(-W / 2)} x2={X(W / 2)} y1={Y(H - sz)} y2={Y(H - sz)} stroke="#000" strokeWidth={0.2} strokeDasharray="1.2 0.6" />
    <line x1={X(-W / 2)} x2={X(W / 2)} y1={Y(H - bed)} y2={Y(H - bed)} stroke="#000" strokeWidth={0.15} strokeDasharray="0.6 0.6" />
    {/* garis galian */}
    <polyline points={`${X(-W / 2)},${Y(0)} ${X(-W / 2)},${Y(H)} ${X(W / 2)},${Y(H)} ${X(W / 2)},${Y(0)}`} fill="none" stroke="#000" strokeWidth={0.5} />
    <line x1={X(-W / 2 - ext)} x2={X(W / 2 + ext)} y1={Y(0)} y2={Y(0)} stroke="#000" strokeWidth={0.6} />
    {/* pipa */}
    <circle cx={cx} cy={Y(pipeY)} r={D / 2 * k} fill="#fff" stroke="#0b4fa8" strokeWidth={0.6} />
    <circle cx={cx} cy={Y(pipeY)} r={Math.max(0.2, D / 2 * k - Math.max(0.35, D * 0.06 * k))} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.2} />
    <line x1={cx - D / 2 * k - 2} x2={cx + D / 2 * k + 2} y1={Y(pipeY)} y2={Y(pipeY)} stroke="#0b4fa8" strokeWidth={0.12} strokeDasharray="2 0.5 0.4 0.5" />
    {/* pita penanda */}
    {tape > 0.05 && <g><line x1={X(-W / 2) + 1} x2={X(W / 2) - 1} y1={Y(tape)} y2={Y(tape)} stroke="#c2410c" strokeWidth={0.5} strokeDasharray="2 1" /></g>}
    {/* dimensi */}
    <DimLine x1={X(-W / 2)} y1={Y(0)} x2={X(W / 2)} y2={Y(0)} off={-9} text={`W = ${fmt(W, 2)}`} />
    <DimLine x1={X(W / 2)} y1={Y(0)} x2={X(W / 2)} y2={Y(H)} off={ext * k * 0.55} vertical text={`H = ${fmt(H, 2)}`} />
    <DimLine x1={X(-W / 2)} y1={Y(H - bed)} x2={X(-W / 2)} y2={Y(H)} off={-6} vertical size={1.8} text={fmt(bed, 2)} />
    <DimLine x1={X(-W / 2)} y1={Y(H - sz)} x2={X(-W / 2)} y2={Y(H - bed - D)} off={-6} vertical size={1.8} text={fmt(cov, 2)} />
    <DimLine x1={X(-W / 2)} y1={Y(0)} x2={X(-W / 2)} y2={Y(H - sz)} off={-12} vertical size={1.8} text={fmt(H - sz, 2)} />
    {leader(X(W / 4), Y((H - sz) / 2), X(W / 2 + ext) + 4, Y(0) + 8, ['Urugan tanah kembali,', 'dipadatkan per lapis 20 cm'])}
    {tape > 0.05 && leader(X(W / 2) - 2, Y(tape), X(W / 2 + ext) + 4, Y(tape) + 6, ['Pita penanda pipa', `(±${fmt(tape, 2)} m dari muka tanah)`])}
    {leader(cx + D / 2 * k * 0.7, Y(pipeY) - D / 2 * k * 0.7, X(W / 2 + ext) + 4, Y(pipeY) - 1, [`Pipa ${grp ? MATERIALS[grp.material].label : ''} Ø${D0} mm`])}
    {leader(X(-W / 4), Y(H - bed / 2), X(W / 2 + ext) + 4, Y(H) + 3, [`Pasir alas t = ${fmt(bed, 2)} m &`, `pasir penutup ${fmt(cov, 2)} m di atas pipa`])}
    {leader(X(W / 2 + ext * 0.6), Y(0) + 4, X(W / 2 + ext) + 4, Y(0) - 7, ['Muka tanah asli'])}
    <text x={X(-W / 2)} y={Y(H) + 0.12 * k + 3.5} fontSize={1.9}>Dasar galian (dibersihkan & diratakan)</text>
    {/* tabel data teknis */}
    {(() => { const tx = 22, ty = Y(H) + 0.12 * k + 16, tw = 110; const rx = 142; const rows = [
      ['Lebar galian (W)', fmt(W, 2) + ' m'], ['Kedalaman galian (H)', fmt(H, 2) + ' m'], ['Tebal pasir alas', fmt(bed, 2) + ' m'], ['Tebal pasir di atas pipa', fmt(cov, 2) + ' m'],
      ['Diameter pipa', `Ø${D0} mm`], ['Tebal tanah di atas zona pasir', fmt(H - sz, 2) + ' m'],
      ['Volume galian per meter', fmt(per.galian, 3) + ' m³/m'], ['Volume pasir per meter', fmt(per.pasir, 3) + ' m³/m'], ['Volume urugan kembali per meter', fmt(per.kembali, 3) + ' m³/m']];
      return <g fontSize={2.1}>
        <text x={tx} y={ty - 2} fontWeight={700} fontSize={2.5}>DATA TEKNIS GALIAN</text>
        {rows.map((r, i) => <g key={i}><rect x={tx} y={ty + i * 5} width={tw} height={5} fill={i % 2 ? '#fff' : '#f3f3f3'} stroke="#000" strokeWidth={0.2} /><text x={tx + 2} y={ty + 3.5 + i * 5}>{r[0]}</text><text x={tx + tw - 2} y={ty + 3.5 + i * 5} textAnchor="end" fontWeight={600}>{r[1]}</text></g>)}
        <text x={rx} y={ty - 2} fontWeight={700} fontSize={2.5}>REKAP VOLUME SELURUH JALUR</text>
        {[['Jenis / Ø', 'L (m)', 'Galian', 'Pasir', 'Urugan']].concat(boq.pipeGroups.map(g => [`${g.material} Ø${g.diameter}`, fmt(g.length, 1), fmt(g.galian, 2), fmt(g.pasir, 2), fmt(g.kembali, 2)])).concat([['JUMLAH (m³)', fmt(boq.totalLength, 1), fmt(boq.earth.galian, 2), fmt(boq.earth.pasir, 2), fmt(boq.earth.kembali, 2)]]).slice(0, 18).map((r, i, arr) => {
          const y = ty + i * 4.6; const cw = [44, 35, 35, 35, 35]; let xx = rx;
          return <g key={i}><rect x={rx} y={y} width={184} height={4.6} fill={i === 0 || i === arr.length - 1 ? '#eee' : '#fff'} stroke="#000" strokeWidth={0.2} />
            {r.map((c, j) => { const t = <text key={j} x={j === 0 ? xx + 1.5 : xx + cw[j] - 1.5} y={y + 3.2} textAnchor={j === 0 ? 'start' : 'end'} fontWeight={i === 0 || i === arr.length - 1 ? 700 : 400} fontSize={1.9}>{c}</text>; xx += cw[j]; return t; })}</g>; })}
      </g>; })()}
  </Sheet>;
}

/* =====================================================================
   12b. GAMBAR DED BANGUNAN PELENGKAP
   ===================================================================== */
const HaloText = ({ children, ...r }) => <text stroke="#fff" strokeWidth={0.7} paintOrder="stroke" strokeLinejoin="round" fill="#000" {...r}>{children}</text>;
function ElevMark({ x, y, text, anchor = 'start', color = '#000', below = false }) {
  const dir = anchor === 'start' ? 1 : -1;
  return <g>
    <line x1={x - 1.6 * dir} x2={x + 12 * dir} y1={y} y2={y} stroke={color} strokeWidth={0.18} />
    <path d={`M${x - 1.1} ${y - 1.7} L${x + 1.1} ${y - 1.7} L${x} ${y} Z`} fill="#fff" stroke={color} strokeWidth={0.22} />
    <HaloText x={x + 1.8 * dir} y={below ? y + 2.4 : y - 0.7} fontSize={1.75} textAnchor={anchor} fill={color}>{text}</HaloText>
  </g>;
}
function ViewTitle({ x, y, title, S }) {
  return <g textAnchor="middle"><text x={x} y={y} fontSize={2.8} fontWeight={700}>{title}</text>
    <line x1={x - title.length * 0.9} x2={x + title.length * 0.9} y1={y + 0.9} y2={y + 0.9} stroke="#000" strokeWidth={0.35} />
    <text x={x} y={y + 4} fontSize={1.9}>SKALA {fmtScale(S)}</text></g>;
}
const STUB = 0.55;

function StructPlan({ g, ox, oy, w, h, k, S }) {
  const { L, B, tw, ov } = g;
  const leftX = g.pipes.some(p => p.wall === 'L') ? STUB * k + 14 : g.weep ? 0.9 * k + 4 : 2;
  const topX = g.pipes.some(p => p.wall === 'K') ? STUB * k + 5 : 2;
  const cx = ox + w / 2 + leftX / 2 - 4, cy = oy + (h - 10) / 2 + topX / 3;
  const X = x => cx + (x - L / 2) * k, Y = y => cy + (y - B / 2) * k;
  const tapCount = g.pipes.filter(p => p.kind === 'tap').length;
  const firstTap = g.pipes.findIndex(p => p.kind === 'tap');
  return <g>
    <rect x={X(-tw - ov)} y={Y(-tw - ov)} width={(L + 2 * tw + 2 * ov) * k} height={(B + 2 * tw + 2 * ov) * k} fill="none" stroke="#000" strokeWidth={0.2} strokeDasharray="1.2 0.8" />
    <rect x={X(-tw)} y={Y(-tw)} width={(L + 2 * tw) * k} height={(B + 2 * tw) * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.45} />
    <rect x={X(0)} y={Y(0)} width={L * k} height={B * k} fill="#fff" stroke="#000" strokeWidth={0.35} />
    {g.filter && <rect x={X(0)} y={Y(0)} width={g.filter.x1 * k} height={B * k} fill="url(#pat-gravel)" />}
    {g.parts.map((pt, i) => pt.axis === 'x'
      ? <g key={i}><rect x={X(pt.at)} y={Y(0)} width={pt.t * k} height={B * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />
          {pt.kind === 'perforated' && Array.from({ length: Math.floor(B / 0.2) }).map((_, j) => <rect key={j} x={X(pt.at) - 0.1} y={Y(0.1 + j * 0.2) - 0.35} width={pt.t * k + 0.2} height={0.7} fill="#fff" />)}
          {pt.kind === 'weir' && <HaloText x={X(pt.at + pt.t / 2) + 0.6} y={Y(B * 0.75)} fontSize={1.6} textAnchor="middle" transform={`rotate(-90 ${X(pt.at + pt.t / 2) + 0.6} ${Y(B * 0.75)})`}>Ambang pembagi</HaloText>}</g>
      : <rect key={i} x={X(pt.from)} y={Y(pt.at - pt.t / 2)} width={(pt.to - pt.from) * k} height={pt.t * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />)}
    {g.weep && <g>{Array.from({ length: Math.floor(B / 0.2) }).map((_, j) => { const y = Y(0.1 + j * 0.2); return <g key={j}>
      <rect x={X(-tw) - 0.1} y={y - 0.35} width={tw * k + 0.2} height={0.7} fill="#fff" />
      {j % 2 === 0 && <line x1={X(-tw - 0.85)} x2={X(-tw) - 0.6} y1={y} y2={y} stroke="#0b4fa8" strokeWidth={0.25} markerEnd="url(#arr)" />}</g>; })}
      <HaloText x={X(-tw - 0.45)} y={Y(B) + 4} fontSize={1.8} textAnchor="middle" fill="#0b4fa8">Mata air</HaloText></g>}
    {g.pipes.map((pp, i) => {
      const dk = Math.max(0.7, pp.d / 1000 * k); const tap = pp.kind === 'tap'; const ext = tap ? 0.2 : STUB;
      let x1, x2, y1, y2, lx, ly, anchor; const horiz = pp.wall === 'L' || pp.wall === 'R';
      if (pp.wall === 'L') { x1 = X(-tw - ext); x2 = X(0.12); y1 = y2 = Y(pp.pos); lx = x1 - 1; ly = y1 + 0.7; anchor = 'end'; }
      if (pp.wall === 'R') { x1 = X(L - 0.12); x2 = X(L + tw + ext); y1 = y2 = Y(pp.pos); lx = x2 + 1; ly = y1 + 0.7; anchor = 'start'; }
      if (pp.wall === 'K') { x1 = x2 = X(pp.pos); y1 = Y(-tw - ext); y2 = Y(0.12); lx = x1; ly = y1 - 1.5; anchor = 'middle'; }
      if (pp.wall === 'F') { x1 = x2 = X(pp.pos); y1 = Y(B - 0.12); y2 = Y(B + tw + ext); lx = x1; ly = y2 + 3.4; anchor = 'middle'; }
      const vx = pp.wall === 'L' ? X(-tw - 0.3) : pp.wall === 'R' ? X(L + tw + 0.3) : x1;
      const vy = pp.wall === 'K' ? Y(-tw - 0.3) : pp.wall === 'F' ? Y(B + tw + 0.3) : y1;
      return <g key={i}>
        {horiz ? <rect x={Math.min(x1, x2)} y={y1 - dk / 2} width={Math.abs(x2 - x1)} height={dk} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />
          : <rect x={x1 - dk / 2} y={Math.min(y1, y2)} width={dk} height={Math.abs(y2 - y1)} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />}
        {pp.valve && <DedSymbol type="gate_valve" x={vx} y={vy} angle={horiz ? 0 : 90} s={Math.max(0.7, dk / 2.2)} />}
        {tap && <circle cx={x1} cy={y2} r={0.9} fill="#fff" stroke="#000" strokeWidth={0.25} />}
        {(!tap || i === firstTap) && <HaloText x={tap ? X(L / 2) : lx} y={ly} fontSize={1.8} textAnchor={anchor}>{tap ? `${tapCount} × Kran ½" (jarak ${fmt(L / tapCount, 2)} m)` : `${pp.label} Ø${pp.d}`}</HaloText>}
      </g>;
    })}
    {g.float && (() => { const pin = g.pipes.find(x => x.kind === 'in'); return pin ? <circle cx={X(0.42)} cy={Y(pin.pos)} r={Math.max(0.8, 0.07 * k)} fill="#fff" stroke="#0b4fa8" strokeWidth={0.3} /> : null; })()}
    {g.ladder && <g><rect x={X(0.02)} y={Y(g.mhY - 0.2)} width={0.16 * k} height={0.4 * k} fill="none" stroke="#000" strokeWidth={0.25} />{[0.1, 0.2, 0.3].map(v => <line key={v} x1={X(0.02)} x2={X(0.18)} y1={Y(g.mhY - 0.2 + v)} y2={Y(g.mhY - 0.2 + v)} stroke="#000" strokeWidth={0.2} />)}</g>}
    <g><rect x={X(g.mhX - g.mh / 2)} y={Y(g.mhY - g.mh / 2)} width={g.mh * k} height={g.mh * k} fill="none" stroke="#000" strokeWidth={0.3} strokeDasharray="1.2 0.6" />
      <line x1={X(g.mhX - g.mh / 2)} y1={Y(g.mhY - g.mh / 2)} x2={X(g.mhX + g.mh / 2)} y2={Y(g.mhY + g.mh / 2)} stroke="#000" strokeWidth={0.15} strokeDasharray="1.2 0.6" />
      <line x1={X(g.mhX + g.mh / 2)} y1={Y(g.mhY - g.mh / 2)} x2={X(g.mhX - g.mh / 2)} y2={Y(g.mhY + g.mh / 2)} stroke="#000" strokeWidth={0.15} strokeDasharray="1.2 0.6" />
      <HaloText x={X(g.mhX)} y={Y(g.mhY + g.mh / 2) + 2.6} fontSize={1.6} textAnchor="middle">MH {fmt(g.mh * 100, 0)}×{fmt(g.mh * 100, 0)}</HaloText></g>
    {g.vent && <g><circle cx={X(L * 0.78)} cy={Y(B / 2)} r={Math.max(0.9, 0.03 * k)} fill="#fff" stroke="#000" strokeWidth={0.3} /><HaloText x={X(L * 0.78) + 1.8} y={Y(B / 2) + 0.6} fontSize={1.6}>Ventilasi</HaloText></g>}
    {/* garis potong */}
    {(() => { const xa = X(-tw - ov) - 3, xb = X(L + tw + ov) + 3, y = Y(g.cutY); const xc = X(g.cutX), ya = Y(-tw - ov) - 3, yb = Y(B + tw + ov) + 3;
      return <g fontSize={2.6} fontWeight={700}>
        <line x1={xa} x2={xb} y1={y} y2={y} stroke="#000" strokeWidth={0.2} strokeDasharray="4 1 0.6 1" />
        {[xa, xb].map((x, i) => <g key={i}><line x1={x} x2={x} y1={y} y2={y - 3.5} stroke="#000" strokeWidth={0.4} markerEnd="url(#arr)" /><text x={x + (i ? 1 : -1)} y={y - 1.2} textAnchor={i ? 'start' : 'end'}>A</text></g>)}
        <line x1={xc} x2={xc} y1={ya} y2={yb} stroke="#000" strokeWidth={0.2} strokeDasharray="4 1 0.6 1" />
        {[ya, yb].map((y2, i) => <g key={i}><line x1={xc} x2={xc - 3.5} y1={y2} y2={y2} stroke="#000" strokeWidth={0.4} markerEnd="url(#arr)" /><text x={xc + 1} y={y2 + (i ? 2.6 : -0.8)}>B</text></g>)}
      </g>; })()}
    {/* dimensi */}
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(0)} y2={Y(-tw)} off={-(4 + topX)} size={1.6} text={fmt(tw, 2)} />
    <DimLine x1={X(0)} y1={Y(-tw)} x2={X(L)} y2={Y(-tw)} off={-(4 + topX)} size={1.9} text={fmt(L, 2)} />
    <DimLine x1={X(L)} y1={Y(-tw)} x2={X(L + tw)} y2={Y(-tw)} off={-(4 + topX)} size={1.6} text={fmt(tw, 2)} />
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(L + tw)} y2={Y(-tw)} off={-(9 + topX)} size={1.9} text={fmt(g.Lo, 2)} />
    <DimLine x1={X(-tw)} y1={Y(0)} x2={X(-tw)} y2={Y(B)} off={-(4 + leftX)} vertical size={1.9} text={fmt(B, 2)} />
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(-tw)} y2={Y(B + tw)} off={-(9 + leftX)} vertical size={1.9} text={fmt(g.Bo, 2)} />
    <ViewTitle x={ox + w / 2} y={oy + h - 6} title={`DENAH ${g.label}`} S={S} />
  </g>;
}

function StructSection({ g, axis, ox, oy, w, h, k, S }) {
  const A = axis === 'A';
  const span = A ? g.L : g.B; const { tw, tb, tr, tlk, ov, Hw, p } = g; const H = g.Hin;
  const zTop = H + tr, zBot = -tb - tlk, zg = g.embed - tb, soilW = 0.8;
  const top = Math.max(zTop + 0.9, zg + 0.3), bot = zBot - 0.3;
  const availH = h - 12 - 12;
  const cx = ox + w / 2 + 6;
  const U = u => cx + (u - span / 2) * k;
  const Z = z => oy + 3 + Math.max(0, (availH - (top - bot) * k) / 2) + (top - z) * k;
  const elev = z => g.floor + z;
  const lw = A ? 'L' : 'K', rw = A ? 'R' : 'F';
  const mhU = A ? g.mhX : g.mhY;
  const P = [[-tw - ov, -tb], [span + tw + ov, -tb], [span + tw + ov, 0], [span + tw, 0], [span + tw, zTop], [-tw, zTop], [-tw, 0], [-tw - ov, 0]];
  const d = 'M' + P.map(([u, z]) => `${U(u)} ${Z(z)}`).join(' L') + ' Z';
  const c = 0.045;
  const bars = [
    [-tw + c, -tb + c, -tw + c, zTop - c, p.rebarWall], [-c, -tb + c, -c, zTop - c, p.rebarWall],
    [span + c, -tb + c, span + c, zTop - c, p.rebarWall], [span + tw - c, -tb + c, span + tw - c, zTop - c, p.rebarWall],
    [-tw - ov + c, -tb + c, span + tw + ov - c, -tb + c, p.rebarSlab], [-tw - ov + c, -c, span + tw + ov - c, -c, p.rebarSlab],
    [-tw + c, H + c, span + tw - c, H + c, p.rebarRoof], [-tw + c, zTop - c, span + tw - c, zTop - c, p.rebarRoof],
  ];
  const fbBand = g.fb * k >= 3.6;
  return <g>
    <rect x={U(-tw - ov - soilW)} y={Z(zg)} width={(span + 2 * tw + 2 * ov + 2 * soilW) * k} height={(zg - bot) * k} fill="url(#pat-soil)" />
    <line x1={U(-tw - ov - soilW)} x2={U(span + tw + ov + soilW)} y1={Z(zg)} y2={Z(zg)} stroke="#5b4421" strokeWidth={0.55} />
    <rect x={U(-tw - ov - 0.05)} y={Z(-tb)} width={(span + 2 * tw + 2 * ov + 0.1) * k} height={Math.max(0.3, tlk * k)} fill="#d4d4d4" stroke="#000" strokeWidth={0.2} />
    <path d={d} fill="#fff" /><path d={d} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.45} />
    <rect x={U(0)} y={Z(H)} width={span * k} height={H * k} fill="#fff" stroke="#000" strokeWidth={0.35} />
    <rect x={U(0)} y={Z(Hw)} width={span * k} height={Hw * k} fill="#d6ebf8" />
    <line x1={U(0)} x2={U(span)} y1={Z(Hw)} y2={Z(Hw)} stroke="#0b4fa8" strokeWidth={0.3} strokeDasharray="1.6 0.8" />
    {A && g.filter && <rect x={U(0)} y={Z(g.filter.h)} width={g.filter.x1 * k} height={g.filter.h * k} fill="url(#pat-gravel)" opacity={0.9} />}
    {A && g.filter && <HaloText x={U(g.filter.x1 / 2)} y={Z(g.filter.h / 2)} fontSize={1.7} textAnchor="middle">Filter kerikil</HaloText>}
    {g.parts.map((pt, i) => {
      const cut = A ? pt.axis === 'x' : (pt.axis === 'y' && g.cutX >= pt.from && g.cutX <= pt.to);
      if (cut) { const u0 = A ? pt.at : pt.at - pt.t / 2;
        return <g key={i}><rect x={U(u0)} y={Z(pt.h)} width={pt.t * k} height={pt.h * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />
          {pt.kind === 'perforated' && Array.from({ length: Math.floor(pt.h / 0.2) }).map((_, j) => <circle key={j} cx={U(u0 + pt.t / 2)} cy={Z(0.12 + j * 0.2)} r={0.55} fill="#fff" stroke="#000" strokeWidth={0.12} />)}
          {pt.kind === 'weir' && <HaloText x={U(u0 + pt.t / 2)} y={Z(pt.h) - 1.2} fontSize={1.7} textAnchor="middle">Ambang +{fmt(elev(pt.h), 2)}</HaloText>}
          {pt.kind === 'perforated' && <HaloText x={U(u0 + pt.t) + 1} y={Z(Hw * 0.55)} fontSize={1.6}>Sekat berlubang</HaloText>}</g>; }
      const u0 = A ? pt.from : 0, u1 = A ? pt.to : span;
      return <rect key={i} x={U(u0)} y={Z(pt.h)} width={(u1 - u0) * k} height={pt.h * k} fill="none" stroke="#000" strokeWidth={0.2} strokeDasharray="1 0.7" />;
    })}
    {/* tulangan */}
    {bars.map(([u1, z1, u2, z2, lab], i) => { const len = Math.hypot(u2 - u1, z2 - z1); const spc = rebarSpacing(lab); const n = Math.min(80, Math.floor(len / spc));

        {Array.from({ length: n }).map((_, j) => { const t = (j + 0.5) / n; const du = (u1 === u2) ? (u1 < span / 2 ? (u1 < -tw / 2 ? 1 : -1) : (u1 < span + tw / 2 ? 1 : -1)) * 0.012 : 0; const dz = (z1 === z2) ? (z1 < 0 ? (z1 < -tb / 2 ? 1 : -1) : (z1 < H + tr / 2 ? 1 : -1)) * 0.012 : 0;
          return <circle key={j} cx={U(u1 + (u2 - u1) * t + du)} cy={Z(z1 + (z2 - z1) * t + dz)} r={0.28} fill="#000" />; })}</g>; })}

      {Array.from({ length: Math.floor(H / 0.3) }).map((_, j) => <line key={j} x1={U(0)} x2={U(0.2)} y1={Z(0.3 + j * 0.3)} y2={Z(0.3 + j * 0.3)} stroke="#000" strokeWidth={0.25} />)}

    {A && g.vent && (() => { const u = span * 0.8, r = 0.12; const dv = Math.max(0.6, 0.06 * k);
      return <g><path d={`M${U(u)} ${Z(H)} L${U(u)} ${Z(zTop + 0.4)} A${r * k} ${r * k} 0 0 0 ${U(u + 2 * r)} ${Z(zTop + 0.4)} L${U(u + 2 * r)} ${Z(zTop + 0.28)}`} fill="none" stroke="#0b4fa8" strokeWidth={dv} />
        <HaloText x={U(u + 2 * r) + 1.5} y={Z(zTop + 0.4)} fontSize={1.6}>Ventilasi GIP Ø2"</HaloText></g>; })()}
    {/* pipa */}
    {g.pipes.map((pp, i) => {
      const dk = Math.max(0.7, pp.d / 1000 * k); const tap = pp.kind === 'tap';
      if (pp.wall === lw || pp.wall === rw) {
        const left = pp.wall === lw; const ext = tap ? 0.2 : STUB;
        const u1 = left ? -tw - ext : span - 0.12, u2 = left ? 0.12 : span + tw + ext; const uo = left ? u1 : u2; const ui = left ? u2 : u1;
        const firstTap = tap && g.pipes.findIndex(x => x.kind === 'tap' && x.wall === pp.wall) === i;
        if (tap && !A && Math.abs(pp.pos - g.cutX) > 0.05) return null;
        return <g key={i}>
          <rect x={U(u1)} y={Z(pp.z) - dk / 2} width={(u2 - u1) * k} height={dk} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />
          {pp.kind === 'of' && <rect x={U(uo) - (left ? 0 : dk)} y={Z(pp.z) - dk / 2} width={dk} height={0.45 * k} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />}

          {tap && <g><line x1={U(uo)} x2={U(uo)} y1={Z(pp.z)} y2={Z(pp.z) + 2.2} stroke="#000" strokeWidth={0.45} /><line x1={U(uo) - 1} x2={U(uo) + 1} y1={Z(pp.z) - 1.6} y2={Z(pp.z) - 1.6} stroke="#000" strokeWidth={0.45} /><line x1={U(uo)} x2={U(uo)} y1={Z(pp.z) - 1.6} y2={Z(pp.z)} stroke="#000" strokeWidth={0.3} /></g>}
          {(!tap || firstTap || !A) && <HaloText x={U(uo) + (left ? 0.3 : -0.3)} y={Z(pp.z) - dk / 2 - (tap ? 2.4 : 0.8)} fontSize={1.6} textAnchor={left ? 'start' : 'end'}>{pp.label} Ø{pp.d}</HaloText>}
        </g>;
      }
      const shown = ['in', 'of'].includes(pp.kind) && g.pipes.filter(x => x.kind === pp.kind && x.wall === pp.wall).indexOf(pp) === 0;
      return <g key={i}><circle cx={U(pp.pos)} cy={Z(pp.z)} r={Math.max(0.5, dk / 2)} fill="#fff" stroke="#0b4fa8" strokeWidth={0.25} strokeDasharray="0.6 0.4" />
        {shown && <HaloText x={U(pp.pos) + dk / 2 + 0.8} y={Z(pp.z) + (pp.kind === 'dr' ? -1.2 : 2.6)} fontSize={1.5}>{pp.kind === 'tap' ? 'Kran' : pp.label} Ø{pp.d}</HaloText>}</g>;
    })}
    {g.float && A && (() => { const pin = g.pipes.find(x => x.kind === 'in'); if (!pin) return null; const r = Math.max(0.8, 0.07 * k);
      return <g><line x1={U(0.12)} y1={Z(pin.z)} x2={U(0.42)} y2={Z(Hw) - r} stroke="#000" strokeWidth={0.3} /><circle cx={U(0.42)} cy={Z(Hw) - r} r={r} fill="#fff" stroke="#000" strokeWidth={0.3} />
        <HaloText x={U(0.42) + r + 0.8} y={Z(Hw) - r - 1.4} fontSize={1.6}>Katup pelampung</HaloText></g>; })()}
    {A && g.weep && <g>{Array.from({ length: Math.max(1, Math.floor((Hw - 0.05) / 0.2)) }).map((_, j) => { const z = 0.15 + j * 0.2; return <g key={j}>
      <rect x={U(-tw) - 0.1} y={Z(z) - 0.4} width={tw * k + 0.2} height={0.8} fill="#fff" stroke="#000" strokeWidth={0.1} />
      <line x1={U(-tw - ov - 0.7)} x2={U(-tw) - 0.5} y1={Z(z)} y2={Z(z)} stroke="#0b4fa8" strokeWidth={0.25} markerEnd="url(#arr)" /></g>; })}
      <HaloText x={U(-tw - ov - 0.35)} y={Z(Hw) - 1.2} fontSize={1.7} textAnchor="middle" fill="#0b4fa8">Mata air</HaloText></g>}
    {/* label struktur */}
    {fbBand
      ? <HaloText x={U(span / 2)} y={Z((Hw + H) / 2) + 0.7} fontSize={1.6} textAnchor="middle">Tul. dinding {p.rebarWall} (2 lapis) · atap {p.rebarRoof}</HaloText>
      : <HaloText x={U(span / 2)} y={Z(zTop) - 1.2 - (Math.abs(span / 2 - mhU) * k < 22 ? 5.5 : 0)} fontSize={1.6} textAnchor="middle">Tul. dinding {p.rebarWall} · atap {p.rebarRoof}</HaloText>}
    <HaloText x={U(span / 2)} y={Z(zBot) + 2.4} fontSize={1.6} textAnchor="middle">Pelat dasar t={fmt(tb, 2)} · {p.rebarSlab} · lantai kerja t={fmt(tlk, 2)}</HaloText>
    {/* elevasi */}
    <ElevMark x={U(span * 0.42)} y={Z(Hw)} text={`MAT ${elevTxt(elev(Hw))}`} color="#0b4fa8" below />
    <ElevMark x={U(span * 0.1) + 1.5} y={Z(0)} text={elevTxt(elev(0))} />
    <ElevMark x={U(A ? span * 0.5 : span * 0.82)} y={Z(zTop)} text={elevTxt(elev(zTop))} />
    <ElevMark x={U(-tw - ov - soilW) + 2} y={Z(zg)} text={`MT ${elevTxt(g.ground)}`} />
    {/* dimensi */}
    {[[-tb, 0, fmt(tb, 2)], [0, Hw, fmt(Hw, 2)], [Hw, H, fmt(g.fb, 2)], [H, zTop, fmt(tr, 2)]].map(([z1, z2, t], i) =>
      <DimLine key={i} x1={U(-tw - ov - soilW)} y1={Z(z2)} x2={U(-tw - ov - soilW)} y2={Z(z1)} off={-3.5} vertical size={1.5} text={(z2 - z1) * k >= 2.4 ? t : ''} />)}
    <DimLine x1={U(-tw - ov - soilW)} y1={Z(zTop)} x2={U(-tw - ov - soilW)} y2={Z(-tb)} off={-8.5} vertical size={1.7} text={fmt(g.Htot, 2)} />
    {[[-tw, 0, fmt(tw, 2)], [0, span, fmt(span, 2)], [span, span + tw, fmt(tw, 2)]].map(([u1, u2, t], i) =>
      <DimLine key={i} x1={U(u1)} y1={Z(zBot)} x2={U(u2)} y2={Z(zBot)} off={(zBot - bot) * k + 3.5} size={1.6} text={(u2 - u1) * k >= 2.4 ? t : ''} />)}
    <ViewTitle x={ox + w / 2} y={oy + h - 6} title={`POTONGAN ${axis} – ${axis}`} S={S} />
  </g>;
}

function SheetStructure({ project, s, sheetNo, sheetTotal }) {
  const { st, g, q } = s;
  const fits = (k) => {
    const hh = (g.Htot + g.tlk + 1.2) * k + 24;
    return (g.Lo + 2 * g.ov + 2 * STUB) * k + 34 <= 150 && (g.Bo + 2 * g.ov + 2 * STUB) * k + 30 <= 134
      && (g.Lo + 2 * g.ov + 1.6) * k + 20 <= 154 && hh <= 134 && (g.Bo + 2 * g.ov + 1.6) * k + 20 <= 148;
  };
  const S = STRUCT_SCALES.find(v => fits(1000 / v)) || 200; const k = 1000 / S;
  return <Sheet meta={project.meta} title={`${STRUCT_TYPES[st.type].sheet} ${st.label}`} scaleText={fmtScale(S)} sheetNo={sheetNo} sheetTotal={sheetTotal} legend={structLegend(g)}>
    <line x1={FRAME.x0} x2={FRAME.tbX} y1={148.5} y2={148.5} stroke="#000" strokeWidth={0.2} />
    <line x1={172} x2={172} y1={FRAME.y0} y2={FRAME.y1} stroke="#000" strokeWidth={0.2} />
    <StructPlan g={g} ox={18} oy={10} w={152} h={137} k={k} S={S} />
    <StructSection g={g} axis="A" ox={173} oy={10} w={158} h={137} k={k} S={S} />
    <StructSection g={g} axis="B" ox={18} oy={150} w={152} h={137} k={k} S={S} />
    <StructTables g={g} q={q} x={177} y={154} w={150} />
  </Sheet>;
}

function parseRows(text, defKind) {
  return text.split(/\r?\n/).map((line, i) => ({ line, i })).filter(x => x.line.trim() && !x.line.trim().startsWith('#')).map(({ line, i }) => {
    let cols = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : (line.match(/,/g) || []).length >= 2 ? line.split(',') : [line];
    cols = cols.map(c => c.trim()).filter(c => c !== '');
    let coord = null; const used = new Set();
    for (let n = 1; n <= 3 && !coord; n++) for (let k = 0; k + n <= cols.length && !coord; k++) { const r = parseCoord(cols.slice(k, k + n).join(' ')); if (r && !r.error) { coord = r; for (let j = k; j < k + n; j++) used.add(j); } }
    let label, kind, elev, demand;
    cols.forEach((c, j) => { if (used.has(j)) return; const num = c.replace(',', '.');
      if (/^-?\d+(\.\d+)?$/.test(num)) { if (elev === undefined) elev = +num; else if (demand === undefined) demand = +num; return; }
      const g = guessKind(c);
      if (!label && /^[A-Za-z]{1,4}[-\s]?\d+$/.test(c)) { label = c; if (!kind && g !== 'junction') kind = g; }
      else if (!kind && (g !== 'junction' || /junction|percabangan|tee/i.test(c))) kind = g; else if (!label) label = c; });
    return { line: i + 1, lat: coord?.lat, lng: coord?.lng, label, kind: kind || defKind, elev, demand, error: coord ? null : 'koordinat tidak terbaca' };
  });
}

function CoordDialog({ tab, setTab, onClose, project, setProject, field, setSelection, toast }) {

  const parsed = parseCoord(txt); const isSt = kind.startsWith('st:');
  const addSingle = () => {
    if (!parsed || parsed.error) return;

    let id;
    if (isSt) id = createPoint(parsed, kind, opt);

function App() {
  const [project, setProjectRaw] = useState(loadInitialProject);

  const [dialog, setDialog] = useState(false);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState('');
  const fileRef = useRef(null);
  const projectRef = useRef(project); projectRef.current = project;
  const patchProject = useCallback((upd) => setProjectRaw(prev => typeof upd === 'function' ? upd(prev) : upd), []);
