<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: #eef2f1; color: #10232a; font-family: "IBM Plex Sans", system-ui, "Segoe UI", Arial, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  input[type=number]::-webkit-inner-spin-button { opacity: .35; }
  .tp-field { width: 100%; border: 1px solid #d3dddb; border-radius: 6px; padding: 4px 8px; font-size: 13px; background: #fff; color: #10232a; }
  .tp-field:focus { outline: 2px solid #3fa7ab; outline-offset: -1px; border-color: #3fa7ab; }
  .tp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tp-table th { position: sticky; top: 0; background: #f5f8f7; text-align: left; font-weight: 600; color: #3b5257; padding: 6px 8px; border-bottom: 1px solid #d3dddb; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; z-index: 1; }
  .tp-table td { padding: 5px 8px; border-bottom: 1px solid #e6ecea; white-space: nowrap; }
  .tp-table tr.clickable:hover td { background: #ecf7f7; cursor: pointer; }
  .tp-table tr.active td { background: #cfeced; }
  .tp-table td.r, .tp-table th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .s-ok { background: #dcfce7; color: #166534; }
  .s-low { background: #fef9c3; color: #854d0e; }
  .s-high, .s-neg { background: #fee2e2; color: #991b1b; }
  .s-hp { background: #ede9fe; color: #5b21b6; }
  .s-idle, .s-iso { background: #e2e8f0; color: #475569; }
  .s-src { background: #cfeced; color: #0a585d; }
  /* Leaflet markers */
  .tp-node-wrap { background: transparent; border: 0; }
  .tp-node { width: 100%; height: 100%; border-radius: 50%; background: #fff; border: 3px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font: 700 9px/1 "IBM Plex Mono", monospace; color: #10232a; box-sizing: border-box; }
  .tp-node.res { border-radius: 4px; background: #0b6e74; color: #fff; border-color: #fff; outline: 3px solid var(--c); }
  .tp-node.sel { box-shadow: 0 0 0 4px rgba(255,255,255,.95), 0 0 0 7px #f97316; }
  .tp-node.act { animation: tp-pulse 1.1s ease-in-out infinite; }
  @keyframes tp-pulse { 50% { box-shadow: 0 0 0 7px rgba(249,115,22,.45); } }
  @media (prefers-reduced-motion: reduce) { .tp-node.act { animation: none; box-shadow: 0 0 0 5px #f97316; } }
  .tp-label { background: rgba(13,42,49,.86); color: #fff; border: 0; border-radius: 4px; padding: 1px 6px; font: 600 11px "IBM Plex Sans", sans-serif; box-shadow: none; }
  .tp-label::before { display: none; }
  .tp-plabel { background: rgba(255,255,255,.92); color: #10232a; border: 1px solid #d3dddb; border-radius: 4px; padding: 0 5px; font: 500 10px "IBM Plex Mono", monospace; box-shadow: none; }
  .tp-plabel::before { display: none; }
  .tp-arrow { background: transparent; border: 0; }
  @media (pointer: coarse) { .tp-node { font-size: 11px; } .tp-struct { font-size: 11px; line-height: 22px; } .tp-label { font-size: 12px; } }
  @media (max-width: 1023px) { .tp-field { font-size: 16px; padding: 7px 10px; } .tp-table td, .tp-table th { padding: 8px; } }
  html, body { overscroll-behavior: none; }
  #app-shell { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tp-struct { width: 100%; height: 100%; padding: 0 4px; border-radius: 3px; background: #3730a3; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); font: 700 9px/16px "IBM Plex Mono", monospace; text-align: center; box-sizing: border-box; white-space: nowrap; }
  .tp-struct.sel { box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 0 0 6px #f97316; }
  @keyframes tp-rec { 50% { opacity: .35; } }
  .tp-rec { animation: tp-rec 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .tp-rec { animation: none; } }
  .leaflet-container { font-family: "IBM Plex Sans", sans-serif; background: #dfe6e4; }
  .leaflet-container.tool-draw, .leaflet-container.tool-node { cursor: crosshair; }
  .leaflet-container.tool-delete { cursor: not-allowed; }
  .paper { background: #fff; box-shadow: 0 1px 2px rgba(16,35,42,.12), 0 8px 28px rgba(16,35,42,.12); }
  #print-root { display: none; }
  .rp { font-family: "IBM Plex Sans", Arial, sans-serif; color: #000; font-size: 10pt; }
  .rp h1 { font-size: 17pt; margin: 0 0 4pt; }
  .rp h2 { font-size: 12.5pt; margin: 16pt 0 6pt; padding-bottom: 3pt; border-bottom: 1.5pt solid #000; }
  .rp h3 { font-size: 10.5pt; margin: 10pt 0 4pt; }
  .rp table { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-bottom: 6pt; page-break-inside: auto; }
  .rp th, .rp td { border: .6pt solid #555; padding: 2.5pt 4pt; vertical-align: top; }
  .rp th { background: #e8eeee; text-align: center; }
  .rp td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rp tr { page-break-inside: avoid; }
  .rp .sect td { background: #f1f4f4; font-weight: 700; }
  .rp .tot td { font-weight: 700; }
  .rp .page-break { break-before: page; }
  .print-sheet { page: sheet; break-before: page; display: block; }
  .print-sheet svg { width: 100%; height: 100%; display: block; }
  @media print {
    html, body, #root { height: auto; background: #fff; }

  }

</style>

// Jalur dari sumber ke node akhir (untuk potongan memanjang & profil HGL)
function buildPath(project, hyd, endId) {

  const pmap = Object.fromEntries(project.pipes.map(p => [p.id, p]));
  let end = endId && hyd.nodes[endId] && hyd.nodes[endId].dist !== null ? endId : null;

  }

  if (chain.length < 2) return null;

  chain.forEach((id, i) => {

function buildStations(path, interval) {

      const a = path.points[i], b = path.points[i + 1];
      for (let d = Math.ceil((sg.start + 0.01) / interval) * interval; d < sg.end - 0.5; d += interval) {

}

  fittings.forEach(f => { if (f.kind === 'thrust') f.desc = `Thrust block beton K-175 (pipa ${f.key.split('|')[2] === '150' ? '≥ Ø150' : f.key.split('|')[2] === '90' ? 'Ø90–Ø140' : '< Ø90'} mm)`; if (f.kind === 'box' || f.kind === 'hu') f.desc = FITTING_DEF[f.kind].name; });

      const mid = [(a.lat + b.lat) / 2, (a.lng + b.lng) / 2];

function CanvasMap(props) {

  const svgRef = useRef(null);

  const P = useMemo(() => makeProjector(originRef.current.lat, originRef.current.lng), []);
  const fitView = () => {
    const pts = project.nodes.map(n => P.toXY(n.lat, n.lng));

    const xs = pts.map(p => p.x), ys = pts.map(p => -p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

  const drag = useRef(null);

      setView(v => ({ x: w.x - (w.x - v.x) * k, y: w.y - (w.y - v.y) * k, w: v.w * k, h: v.h * k })); };

  const onMove = (e) => {

    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 4) d.moved = true;
    if (!d.moved) return;
    if (d.nodeId && tool === 'select') { d.pos = w; setHover({ ...w, dragging: d.nodeId }); }
    else if (!d.nodeId) { const r = svgRef.current.getBoundingClientRect(); const k = d.view0.w / r.width; setView({ ...d.view0, x: d.view0.x - (e.clientX - d.sx) * k, y: d.view0.y - (e.clientY - d.sy) * k }); }
  };
  const onUp = (e) => {
    const d = drag.current; drag.current = null; if (!d) return;
    if (!d.moved) { if (d.nodeId) props.onNodeClick(d.nodeId); else { const ll = P.toLL(d.start.x, -d.start.y); props.onMapClick(ll); } }
    else if (d.nodeId && tool === 'select' && d.pos) { props.onNodeDrag(d.nodeId, P.toLL(d.pos.x, -d.pos.y)); setHover(null); }
  };

  const nmap = Object.fromEntries(project.nodes.map(n => [n.id, n]));

  const grid = niceStep(view.w / 8);
  const gl = [];
  for (let gx = Math.floor(view.x / grid) * grid; gx < view.x + view.w; gx += grid) gl.push(<line key={'gx' + gx} x1={gx} x2={gx} y1={view.y} y2={view.y + view.h} stroke="#c9d6d3" strokeWidth={u} />);

  return <div className="absolute inset-0 bg-[#f4f7f6]">
    <svg ref={svgRef} className="w-full h-full touch-none select-none" viewBox={`${view.x} ${view.y} ${view.w} ${view.h}`} preserveAspectRatio="xMidYMid meet"
      onPointerDown={e => onDown(e, null)} onPointerMove={onMove} onPointerUp={onUp} style={{ cursor: tool === 'select' ? 'grab' : tool === 'delete' ? 'not-allowed' : 'crosshair' }}>

      {gl}
      {project.pipes.map(p => {
        const a = nmap[p.from], b = nmap[p.to]; if (!a || !b) return null; const A = xy(a), B = xy(b); const r = hyd.pipes[p.id];
        const st = colorMode === 'velocity' ? r.status : (hyd.nodes[r.down]?.status || 'iso');

        return <g key={p.id} onPointerDown={e => { e.stopPropagation(); }} onClick={e => { e.stopPropagation(); props.onPipeClick(p.id); }} style={{ cursor: 'pointer' }}>
          <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="transparent" strokeWidth={u * 14} />
          {sel && <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="#f97316" strokeWidth={u * 10} strokeLinecap="round" opacity={0.5} />}
          <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={STATUS_COLORS[st === 'src' ? 'ok' : st]} strokeWidth={u * (3 + Math.min(6, p.diameter / 40))} strokeLinecap="round" />
          {showLabels && <text x={(A.x + B.x) / 2} y={(A.y + B.y) / 2 - u * 8} fontSize={u * 11} textAnchor="middle" fill="#10232a" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" fontFamily="IBM Plex Mono, monospace">{p.label} Ø{p.diameter} · {fmt(r.length, 0)} m</text>}
        </g>;
      })}
      {(props.tracks || []).map(t => t.points.length > 1 && <polyline key={t.id} points={t.points.map(q => { const p = P.toXY(q[0], q[1]); return `${p.x},${-p.y}`; }).join(' ')} fill="none" stroke="#f97316" strokeWidth={u * 3} strokeDasharray={`${u} ${u * 6}`} strokeLinecap="round" pointerEvents="none" />)}
      {(project.structures || []).filter(st => !st.nodeId && st.lat != null).map(st => { const q = P.toXY(st.lat, st.lng); const sel = selection?.kind === 'struct' && selection.id === st.id;
        return <g key={st.id} onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); props.onStructClick(st.id); }} style={{ cursor: 'pointer' }}>
          <rect x={q.x - u * 16} y={-q.y - u * 10} width={u * 32} height={u * 20} rx={u * 3} fill="#3730a3" stroke={sel ? '#f97316' : '#fff'} strokeWidth={u * (sel ? 4 : 2)} />
          <text x={q.x} y={-q.y + u * 3.5} fontSize={u * 9} textAnchor="middle" fontWeight={700} fill="#fff" fontFamily="IBM Plex Mono, monospace" pointerEvents="none">{STRUCT_TYPES[st.type].short}</text>
          {showLabels && <text x={q.x + u * 20} y={-q.y + u * 4} fontSize={u * 11} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" pointerEvents="none">{st.label}</text>}</g>; })}
      {props.gpsPos && (() => { const q = P.toXY(props.gpsPos.lat, props.gpsPos.lng); return <g pointerEvents="none"><circle cx={q.x} cy={-q.y} r={props.gpsPos.acc || 10} fill="#3b82f6" opacity={0.12} /><circle cx={q.x} cy={-q.y} r={u * 8} fill="#2563eb" stroke="#fff" strokeWidth={u * 3} /></g>; })()}
      {act && tool === 'draw' && hover && <line x1={xy(act).x} y1={xy(act).y} x2={hover.x} y2={hover.y} stroke="#f97316" strokeWidth={u * 2.5} strokeDasharray={`${u * 6} ${u * 6}`} pointerEvents="none" />}
      {project.nodes.map(n => {
        const p = xy(n); const r = hyd.nodes[n.id]; const sel = selection?.kind === 'node' && selection.id === n.id;
        const color = isSrc(n) ? '#0b6e74' : STATUS_COLORS[r.status];
        return <g key={n.id} onPointerDown={e => onDown(e, n.id)} style={{ cursor: 'pointer' }}>
          {(sel || activeNode === n.id) && <circle cx={p.x} cy={p.y} r={u * 17} fill="none" stroke="#f97316" strokeWidth={u * 3} />}
          {isSrc(n)
            ? <rect x={p.x - u * 11} y={p.y - u * 11} width={u * 22} height={u * 22} rx={u * 3} fill="#0b6e74" stroke="#fff" strokeWidth={u * 2.5} />
            : <circle cx={p.x} cy={p.y} r={u * 11} fill="#fff" stroke={color} strokeWidth={u * 3.5} />}
          <text x={p.x} y={p.y + u * 3.5} fontSize={u * 9} textAnchor="middle" fontWeight={700} fill={isSrc(n) ? '#fff' : '#10232a'} fontFamily="IBM Plex Mono, monospace" pointerEvents="none">{NODE_TYPES[n.type].short}</text>
          {showLabels && <text x={p.x + u * 15} y={p.y + u * 4} fontSize={u * 11} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 3} paintOrder="stroke" pointerEvents="none">{n.label}{r.pressure !== null && n.type !== 'reservoir' ? ` · ${fmt(r.pressure, 1)} mka` : ''}</text>}
        </g>;
      })}
    </svg>
    <div className="absolute bottom-2 left-2 bg-white/90 border border-line rounded px-2 py-1 text-[11px] text-slate-600 num">Kanvas koordinat lokal · grid {fmt(grid, 0)} m · scroll untuk zoom, seret untuk geser</div>
  </div>;
}

function MapWorkspace({ project, setProject, hyd, selection, setSelection, field }) {

  const makePipe = (p, from, to) => ({ id: uid('p'), label: nextLabel(p.pipes, 'P'), from, to, material: prefs.material, diameter: prefs.diameter });
  const pipeExists = (p, a, b) => p.pipes.some(x => (x.from === a && x.to === b) || (x.from === b && x.to === a));

  const onMapClick = (ll) => {
    if ((tool === 'node' || tool === 'draw') && placingStruct) { const id = createPoint(ll, newType, {}); setSelection({ kind: 'struct', id }); return; }
    if (tool === 'node') { const id = createPoint(ll, newType, { connect: false, chain: false }); setSelection({ kind: 'node', id }); }

    else if (tool === 'select') setSelection(null);
  };
  const onNodeClick = (id) => {

      if (activeNode && activeNode !== id) setProject(p => pipeExists(p, activeNode, id) ? p : { ...p, pipes: [...p.pipes, makePipe(p, activeNode, id)] });
      setActiveNode(id);

  const onPipeClick = (id) => { if (tool === 'delete') { deletePipe(id); return; } setSelection({ kind: 'pipe', id }); };

function Legend({ mode, settings: s }) {
  const items = mode === 'velocity'
    ? [['ok', `${fmt(s.vMin, 1)} – ${fmt(s.vMax, 1)} m/s (ideal)`], ['low', `< ${fmt(s.vMin, 1)} m/s (endapan)`], ['high', `> ${fmt(s.vMax, 1)} m/s (gerusan)`], ['idle', 'Tanpa aliran']]
    : [['ok', `${s.pMin} – ${s.pMax} mka`], ['low', `0 – ${s.pMin} mka`], ['neg', '< 0 mka (negatif)'], ['hp', `> ${s.pMax} mka`]];
  return <div className="min-w-[180px]">
    <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Legenda {mode === 'velocity' ? 'kecepatan' : 'tekanan'}</div>
    {items.map(([k, l]) => <div key={k} className="flex items-center gap-2 text-[12px] text-slate-700 py-0.5"><span className="w-6 h-1.5 rounded" style={{ background: STATUS_COLORS[k] }} />{l}</div>)}
  </div>;
}
function NodeInspector({ node, res, project, hyd, upd, onDelete, setSelection }) {

      <Field label={<span className="flex items-center gap-1.5">Elevasi (mdpl) <ElevBadge src={node.elevSrc} /></span>}><NumField id="node-elev" value={node.elev} step="0.01" onChange={v => upd({ elev: v, elevAuto: false, elevSrc: 'manual' })} /></Field>
      {node.type === 'borehole' ? <Field label="Sumur bor" hint="Data sumur & pompa diatur di tab Olah Air"><div className="tp-field bg-ground num font-mono">{hyd.pumps[node.id] ? `${fmt(hyd.pumps[node.id].Q, 2)} L/dt · ${fmt(hyd.pumps[node.id].Hd, 0)} m · ${fmt(hyd.pumps[node.id].motor, 2)} kW` : '–'}</div></Field>

        : <Field label="Kebutuhan (L/dtk)"><NumField id="node-demand" value={node.demand} step="0.01" min="0" onChange={v => upd({ demand: Math.max(0, v) })} /></Field>}
      <div className="col-span-2"><Field label="Koordinat (desimal, DMS, atau UTM)"><CoordField id="node-coord" lat={node.lat} lng={node.lng} onChange={ll => upd({ lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7) })} /></Field></div>

    {node.elevAuto && node.elevSrc === 'est' && <p className="text-[11px] text-amber-700">Elevasi sementara diperkirakan dari node sekitar; menunggu data DEM.</p>}

      <span className="text-slate-500">Debit lewat node</span><span className="text-right font-mono num">{fmt(res.cumQ)} L/dtk</span>

      {pipes.map(p => <button key={p.id} type="button" onClick={() => setSelection({ kind: 'pipe', id: p.id })} className="pill s-idle hover:ring-1 hover:ring-aqua-400">{p.label} · Ø{p.diameter}</button>)}</div></div>}

function PipeInspector({ pipe, res, nmap, upd, onDelete, onSplit }) {

function NetworkSchematic({ project, hyd, mode = 'velocity', height = 360, onSelect }) {
  const pts = useMemo(() => { const c = centroid(project.nodes); const P = makeProjector(c.lat, c.lng); return Object.fromEntries(project.nodes.map(n => { const q = P.toXY(n.lat, n.lng); return [n.id, { x: q.x, y: -q.y }]; })); }, [project.nodes]);
  const arr = Object.values(pts); if (!arr.length) return <div className="text-sm text-slate-500 p-6">Belum ada jaringan.</div>;
  const minX = Math.min(...arr.map(p => p.x)), maxX = Math.max(...arr.map(p => p.x)), minY = Math.min(...arr.map(p => p.y)), maxY = Math.max(...arr.map(p => p.y));
  const w = Math.max(100, maxX - minX), h = Math.max(80, maxY - minY); const pad = Math.max(w, h) * 0.14; const u = Math.max((w + pad * 2) / 820, (h + pad * 2) / height);
  return <svg viewBox={`${minX - pad} ${minY - pad} ${w + pad * 2} ${h + pad * 2}`} style={{ width: '100%', height }} className="block">
    {project.pipes.map(p => { const a = pts[p.from], b = pts[p.to]; if (!a || !b) return null; const r = hyd.pipes[p.id];
      const st = mode === 'velocity' ? r.status : (hyd.nodes[r.down]?.status || 'iso'); const col = STATUS_COLORS[st === 'src' ? 'ok' : st];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; const ll = Math.hypot(b.x - a.x, b.y - a.y) || 1; let nx = -(b.y - a.y) / ll, ny = (b.x - a.x) / ll; if (nx > 0) { nx = -nx; ny = -ny; }
      return <g key={p.id} onClick={() => onSelect && onSelect({ kind: 'pipe', id: p.id })} style={{ cursor: 'pointer' }}>
        <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={col} strokeWidth={u * (4 + p.diameter / 30)} strokeLinecap="round" />
        <text x={mx + nx * u * 9} y={my + ny * u * 9 + u * 4} fontSize={u * 11} textAnchor="end" fill="#10232a" stroke="#fff" strokeWidth={u * 4} paintOrder="stroke" fontFamily="IBM Plex Mono, monospace">{p.label} · {mode === 'velocity' ? fmt(r.v) + ' m/s' : 'Ø' + p.diameter}</text>
      </g>; })}
    {project.nodes.map(n => { const p = pts[n.id]; const r = hyd.nodes[n.id]; const col = isSrc(n) ? '#0b6e74' : STATUS_COLORS[r.status];
      return <g key={n.id} onClick={() => onSelect && onSelect({ kind: 'node', id: n.id })} style={{ cursor: 'pointer' }}>
        {isSrc(n) ? <rect x={p.x - u * 10} y={p.y - u * 10} width={u * 20} height={u * 20} fill={col} stroke="#fff" strokeWidth={u * 2} rx={u * 2} />
          : <circle cx={p.x} cy={p.y} r={u * 9} fill="#fff" stroke={col} strokeWidth={u * 4} />}
        <text x={p.x + u * 14} y={p.y + u * 4} fontSize={u * 12.5} fontWeight={600} fill="#0d2a31" stroke="#fff" strokeWidth={u * 4} paintOrder="stroke">{n.label}{!isSrc(n) && r.pressure !== null ? ` · ${fmt(r.pressure, 1)} mka` : isSrc(n) && r.head !== null ? ` · HWL ${fmt(r.head, 1)}` : ''}</text>
      </g>; })}
  </svg>;
}
function ProfileChart({ path, settings, height = 260 }) {

    {tQ.map(q => <text key={'q' + q} x={X(q)} y={Hh - m.b + 15} fontSize={10.5} textAnchor="middle" fill="#64748b">{fmt(q, tq < 1 ? 1 : 0)}</text>)}
    <polyline points={sc.join(' ')} fill="none" stroke="#7c5c2e" strokeWidth={2} strokeDasharray="6 4" />
    <polyline points={pc.join(' ')} fill="none" stroke="#0b6e74" strokeWidth={2.4} />
    <circle cx={X(pr.Q)} cy={Y(pr.H)} r={5.5} fill="#f97316" stroke="#fff" strokeWidth={2} />
    <text x={X(pr.Q) + 8} y={Y(pr.H) - 8} fontSize={11} fontWeight={600} fill="#10232a">Titik kerja {fmt(pr.Q, 2)} L/dt · {fmt(pr.H, 1)} m</text>

  </div></div>;
}

function CrossSectionMini({ s, d }) {
  const W = s.trenchWidth, H = s.trenchDepth, bed = s.sandBed, cov = s.sandCover, D = d / 1000;
  const k = Math.min(150 / (W + 0.8), 100 / (H + 0.1)); const cx = 110, gy = 18;
  const X = v => cx + v * k, Y = v => gy + v * k;
  const sz = Math.min(H, bed + D + cov);
  return <g fontFamily="IBM Plex Sans, sans-serif">
    <rect x={0} y={gy} width={220} height={130 - gy} fill="#d9cbb1" />
    <rect x={X(-W / 2)} y={Y(0)} width={W * k} height={(H - sz) * k} fill="#b49a6e" />
    <rect x={X(-W / 2)} y={Y(H - sz)} width={W * k} height={sz * k} fill="#f3e3a6" />
    <circle cx={cx} cy={Y(H - bed - D / 2)} r={Math.max(2, D / 2 * k)} fill="#0b6e74" />
    <line x1={0} x2={220} y1={gy} y2={gy} stroke="#5b4421" strokeWidth={1.2} />
    <text x={cx} y={gy - 5} fontSize={8} textAnchor="middle" fill="#10232a">W = {fmt(W, 2)} m</text>
    <text x={X(W / 2) + 4} y={Y(H / 2)} fontSize={8} fill="#10232a">H = {fmt(H, 2)} m</text>
    <text x={X(-W / 2) - 4} y={Y(H - bed / 2) + 3} fontSize={7} textAnchor="end" fill="#10232a">alas {fmt(bed, 2)}</text>
    <text x={X(-W / 2) - 4} y={Y(H - sz) + 6} fontSize={7} textAnchor="end" fill="#10232a">pasir</text>
  </g>;
}

function SheetLayout({ project, hyd }) {

function DimLine({ x1, y1, x2, y2, text, off = 0, size = 2.2, vertical }) {

function SheetCrossSection({ project, boq, diameter }) {
  const s = project.settings; const W = +s.trenchWidth, H = +s.trenchDepth, bed = +s.sandBed, cov = +s.sandCover;

    <rect x={X(-W / 2 - ext)} y={Y(0)} width={ext * k} height={(H + 0.12) * k} fill="url(#pat-soil)" />

      return <g fontSize={2.1}>

        {rows.map((r, i) => <g key={i}><rect x={tx} y={ty + i * 5} width={tw} height={5} fill={i % 2 ? '#fff' : '#f3f3f3'} stroke="#000" strokeWidth={0.2} /><text x={tx + 2} y={ty + 3.5 + i * 5}>{r[0]}</text><text x={tx + tw - 2} y={ty + 3.5 + i * 5} textAnchor="end" fontWeight={600}>{r[1]}</text></g>)}
        <text x={rx} y={ty - 2} fontWeight={700} fontSize={2.5}>REKAP VOLUME SELURUH JALUR</text>
        {[['Jenis / Ø', 'L (m)', 'Galian', 'Pasir', 'Urugan']].concat(boq.pipeGroups.map(g => [`${g.material} Ø${g.diameter}`, fmt(g.length, 1), fmt(g.galian, 2), fmt(g.pasir, 2), fmt(g.kembali, 2)])).concat([['JUMLAH (m³)', fmt(boq.totalLength, 1), fmt(boq.earth.galian, 2), fmt(boq.earth.pasir, 2), fmt(boq.earth.kembali, 2)]]).slice(0, 18).map((r, i, arr) => {

const HaloText = ({ children, ...r }) => <text stroke="#fff" strokeWidth={0.7} paintOrder="stroke" strokeLinejoin="round" fill="#000" {...r}>{children}</text>;

const STUB = 0.55;

function StructPlan({ g, ox, oy, w, h, k, S }) {

    <rect x={X(0)} y={Y(0)} width={L * k} height={B * k} fill="#fff" stroke="#000" strokeWidth={0.35} />

          {pt.kind === 'perforated' && Array.from({ length: Math.floor(B / 0.2) }).map((_, j) => <rect key={j} x={X(pt.at) - 0.1} y={Y(0.1 + j * 0.2) - 0.35} width={pt.t * k + 0.2} height={0.7} fill="#fff" />)}
          {pt.kind === 'weir' && <HaloText x={X(pt.at + pt.t / 2) + 0.6} y={Y(B * 0.75)} fontSize={1.6} textAnchor="middle" transform={`rotate(-90 ${X(pt.at + pt.t / 2) + 0.6} ${Y(B * 0.75)})`}>Ambang pembagi</HaloText>}</g>
      : <rect key={i} x={X(pt.from)} y={Y(pt.at - pt.t / 2)} width={(pt.to - pt.from) * k} height={pt.t * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />)}
    {g.weep && <g>{Array.from({ length: Math.floor(B / 0.2) }).map((_, j) => { const y = Y(0.1 + j * 0.2); return <g key={j}>
      <rect x={X(-tw) - 0.1} y={y - 0.35} width={tw * k + 0.2} height={0.7} fill="#fff" />

      <HaloText x={X(-tw - 0.45)} y={Y(B) + 4} fontSize={1.8} textAnchor="middle" fill="#0b4fa8">Mata air</HaloText></g>}

      if (pp.wall === 'F') { x1 = x2 = X(pp.pos); y1 = Y(B - 0.12); y2 = Y(B + tw + ext); lx = x1; ly = y2 + 3.4; anchor = 'middle'; }
      const vx = pp.wall === 'L' ? X(-tw - 0.3) : pp.wall === 'R' ? X(L + tw + 0.3) : x1;
      const vy = pp.wall === 'K' ? Y(-tw - 0.3) : pp.wall === 'F' ? Y(B + tw + 0.3) : y1;
      return <g key={i}>
        {horiz ? <rect x={Math.min(x1, x2)} y={y1 - dk / 2} width={Math.abs(x2 - x1)} height={dk} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />

      <line x1={X(g.mhX - g.mh / 2)} y1={Y(g.mhY - g.mh / 2)} x2={X(g.mhX + g.mh / 2)} y2={Y(g.mhY + g.mh / 2)} stroke="#000" strokeWidth={0.15} strokeDasharray="1.2 0.6" />
      <line x1={X(g.mhX + g.mh / 2)} y1={Y(g.mhY - g.mh / 2)} x2={X(g.mhX - g.mh / 2)} y2={Y(g.mhY + g.mh / 2)} stroke="#000" strokeWidth={0.15} strokeDasharray="1.2 0.6" />
      <HaloText x={X(g.mhX)} y={Y(g.mhY + g.mh / 2) + 2.6} fontSize={1.6} textAnchor="middle">MH {fmt(g.mh * 100, 0)}×{fmt(g.mh * 100, 0)}</HaloText></g>
    {g.vent && <g><circle cx={X(L * 0.78)} cy={Y(B / 2)} r={Math.max(0.9, 0.03 * k)} fill="#fff" stroke="#000" strokeWidth={0.3} /><HaloText x={X(L * 0.78) + 1.8} y={Y(B / 2) + 0.6} fontSize={1.6}>Ventilasi</HaloText></g>}
    {/* garis potong */}
    {(() => { const xa = X(-tw - ov) - 3, xb = X(L + tw + ov) + 3, y = Y(g.cutY); const xc = X(g.cutX), ya = Y(-tw - ov) - 3, yb = Y(B + tw + ov) + 3;
      return <g fontSize={2.6} fontWeight={700}>
        <line x1={xa} x2={xb} y1={y} y2={y} stroke="#000" strokeWidth={0.2} strokeDasharray="4 1 0.6 1" />
        {[xa, xb].map((x, i) => <g key={i}><line x1={x} x2={x} y1={y} y2={y - 3.5} stroke="#000" strokeWidth={0.4} markerEnd="url(#arr)" /><text x={x + (i ? 1 : -1)} y={y - 1.2} textAnchor={i ? 'start' : 'end'}>A</text></g>)}
        <line x1={xc} x2={xc} y1={ya} y2={yb} stroke="#000" strokeWidth={0.2} strokeDasharray="4 1 0.6 1" />
        {[ya, yb].map((y2, i) => <g key={i}><line x1={xc} x2={xc - 3.5} y1={y2} y2={y2} stroke="#000" strokeWidth={0.4} markerEnd="url(#arr)" /><text x={xc + 1} y={y2 + (i ? 2.6 : -0.8)}>B</text></g>)}
      </g>; })()}
    {/* dimensi */}
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(0)} y2={Y(-tw)} off={-(4 + topX)} size={1.6} text={fmt(tw, 2)} />
    <DimLine x1={X(0)} y1={Y(-tw)} x2={X(L)} y2={Y(-tw)} off={-(4 + topX)} size={1.9} text={fmt(L, 2)} />
    <DimLine x1={X(L)} y1={Y(-tw)} x2={X(L + tw)} y2={Y(-tw)} off={-(4 + topX)} size={1.6} text={fmt(tw, 2)} />
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(L + tw)} y2={Y(-tw)} off={-(9 + topX)} size={1.9} text={fmt(g.Lo, 2)} />
    <DimLine x1={X(-tw)} y1={Y(0)} x2={X(-tw)} y2={Y(B)} off={-(4 + leftX)} vertical size={1.9} text={fmt(B, 2)} />
    <DimLine x1={X(-tw)} y1={Y(-tw)} x2={X(-tw)} y2={Y(B + tw)} off={-(9 + leftX)} vertical size={1.9} text={fmt(g.Bo, 2)} />
    <ViewTitle x={ox + w / 2} y={oy + h - 6} title={`DENAH ${g.label}`} S={S} />
  </g>;
}

function StructSection({ g, axis, ox, oy, w, h, k, S }) {
  const A = axis === 'A';
  const span = A ? g.L : g.B; const { tw, tb, tr, tlk, ov, Hw, p } = g; const H = g.Hin;
  const zTop = H + tr, zBot = -tb - tlk, zg = g.embed - tb, soilW = 0.8;
  const top = Math.max(zTop + 0.9, zg + 0.3), bot = zBot - 0.3;
  const availH = h - 12 - 12;
  const cx = ox + w / 2 + 6;
  const U = u => cx + (u - span / 2) * k;
  const Z = z => oy + 3 + Math.max(0, (availH - (top - bot) * k) / 2) + (top - z) * k;
  const elev = z => g.floor + z;
  const lw = A ? 'L' : 'K', rw = A ? 'R' : 'F';
  const mhU = A ? g.mhX : g.mhY;
  const P = [[-tw - ov, -tb], [span + tw + ov, -tb], [span + tw + ov, 0], [span + tw, 0], [span + tw, zTop], [-tw, zTop], [-tw, 0], [-tw - ov, 0]];
  const d = 'M' + P.map(([u, z]) => `${U(u)} ${Z(z)}`).join(' L') + ' Z';
  const c = 0.045;
  const bars = [
    [-tw + c, -tb + c, -tw + c, zTop - c, p.rebarWall], [-c, -tb + c, -c, zTop - c, p.rebarWall],
    [span + c, -tb + c, span + c, zTop - c, p.rebarWall], [span + tw - c, -tb + c, span + tw - c, zTop - c, p.rebarWall],
    [-tw - ov + c, -tb + c, span + tw + ov - c, -tb + c, p.rebarSlab], [-tw - ov + c, -c, span + tw + ov - c, -c, p.rebarSlab],
    [-tw + c, H + c, span + tw - c, H + c, p.rebarRoof], [-tw + c, zTop - c, span + tw - c, zTop - c, p.rebarRoof],
  ];
  const fbBand = g.fb * k >= 3.6;
  return <g>
    <rect x={U(-tw - ov - soilW)} y={Z(zg)} width={(span + 2 * tw + 2 * ov + 2 * soilW) * k} height={(zg - bot) * k} fill="url(#pat-soil)" />
    <line x1={U(-tw - ov - soilW)} x2={U(span + tw + ov + soilW)} y1={Z(zg)} y2={Z(zg)} stroke="#5b4421" strokeWidth={0.55} />
    <rect x={U(-tw - ov - 0.05)} y={Z(-tb)} width={(span + 2 * tw + 2 * ov + 0.1) * k} height={Math.max(0.3, tlk * k)} fill="#d4d4d4" stroke="#000" strokeWidth={0.2} />
    <path d={d} fill="#fff" /><path d={d} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.45} />
    <rect x={U(0)} y={Z(H)} width={span * k} height={H * k} fill="#fff" stroke="#000" strokeWidth={0.35} />
    <rect x={U(0)} y={Z(Hw)} width={span * k} height={Hw * k} fill="#d6ebf8" />
    <line x1={U(0)} x2={U(span)} y1={Z(Hw)} y2={Z(Hw)} stroke="#0b4fa8" strokeWidth={0.3} strokeDasharray="1.6 0.8" />
    {A && g.filter && <rect x={U(0)} y={Z(g.filter.h)} width={g.filter.x1 * k} height={g.filter.h * k} fill="url(#pat-gravel)" opacity={0.9} />}
    {A && g.filter && <HaloText x={U(g.filter.x1 / 2)} y={Z(g.filter.h / 2)} fontSize={1.7} textAnchor="middle">Filter kerikil</HaloText>}
    {g.parts.map((pt, i) => {
      const cut = A ? pt.axis === 'x' : (pt.axis === 'y' && g.cutX >= pt.from && g.cutX <= pt.to);
      if (cut) { const u0 = A ? pt.at : pt.at - pt.t / 2;
        return <g key={i}><rect x={U(u0)} y={Z(pt.h)} width={pt.t * k} height={pt.h * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />
          {pt.kind === 'perforated' && Array.from({ length: Math.floor(pt.h / 0.2) }).map((_, j) => <circle key={j} cx={U(u0 + pt.t / 2)} cy={Z(0.12 + j * 0.2)} r={0.55} fill="#fff" stroke="#000" strokeWidth={0.12} />)}
          {pt.kind === 'weir' && <HaloText x={U(u0 + pt.t / 2)} y={Z(pt.h) - 1.2} fontSize={1.7} textAnchor="middle">Ambang +{fmt(elev(pt.h), 2)}</HaloText>}
          {pt.kind === 'perforated' && <HaloText x={U(u0 + pt.t) + 1} y={Z(Hw * 0.55)} fontSize={1.6}>Sekat berlubang</HaloText>}</g>; }
      const u0 = A ? pt.from : 0, u1 = A ? pt.to : span;
      return <rect key={i} x={U(u0)} y={Z(pt.h)} width={(u1 - u0) * k} height={pt.h * k} fill="none" stroke="#000" strokeWidth={0.2} strokeDasharray="1 0.7" />;
    })}
    {/* tulangan */}
    {bars.map(([u1, z1, u2, z2, lab], i) => { const len = Math.hypot(u2 - u1, z2 - z1); const spc = rebarSpacing(lab); const n = Math.min(80, Math.floor(len / spc));
      return <g key={i}><line x1={U(u1)} y1={Z(z1)} x2={U(u2)} y2={Z(z2)} stroke="#000" strokeWidth={0.28} />
        {Array.from({ length: n }).map((_, j) => { const t = (j + 0.5) / n; const du = (u1 === u2) ? (u1 < span / 2 ? (u1 < -tw / 2 ? 1 : -1) : (u1 < span + tw / 2 ? 1 : -1)) * 0.012 : 0; const dz = (z1 === z2) ? (z1 < 0 ? (z1 < -tb / 2 ? 1 : -1) : (z1 < H + tr / 2 ? 1 : -1)) * 0.012 : 0;
          return <circle key={j} cx={U(u1 + (u2 - u1) * t + du)} cy={Z(z1 + (z2 - z1) * t + dz)} r={0.28} fill="#000" />; })}</g>; })}
    {/* manhole */}
    <rect x={U(mhU - g.mh / 2)} y={Z(zTop) - 0.3} width={g.mh * k} height={tr * k + 0.6} fill="#fff" />
    {[-1, 1].map(sd => { const u0 = sd < 0 ? mhU - g.mh / 2 - 0.1 : mhU + g.mh / 2; return <rect key={sd} x={U(u0)} y={Z(zTop + 0.15)} width={0.1 * k} height={(tr + 0.15) * k} fill="url(#pat-concrete)" stroke="#000" strokeWidth={0.3} />; })}
    <rect x={U(mhU - g.mh / 2 - 0.13)} y={Z(zTop + 0.17)} width={(g.mh + 0.26) * k} height={Math.max(0.5, 0.02 * k)} fill="#000" />
    <path d={`M${U(mhU) - 1.4} ${Z(zTop + 0.17)} q1.4 -1.6 2.8 0`} fill="none" stroke="#000" strokeWidth={0.25} />
    <HaloText x={U(mhU)} y={Z(zTop + 0.17) - 2.2} fontSize={1.6} textAnchor="middle">Manhole + tutup besi</HaloText>
    {A && g.ladder && <g><line x1={U(0.2)} x2={U(0.2)} y1={Z(0.1)} y2={Z(zTop + 0.1)} stroke="#000" strokeWidth={0.35} />
      {Array.from({ length: Math.floor(H / 0.3) }).map((_, j) => <line key={j} x1={U(0)} x2={U(0.2)} y1={Z(0.3 + j * 0.3)} y2={Z(0.3 + j * 0.3)} stroke="#000" strokeWidth={0.25} />)}
      <HaloText x={U(0.25)} y={Z(H * 0.35)} fontSize={1.6}>Tangga besi Ø19</HaloText></g>}
    {A && g.vent && (() => { const u = span * 0.8, r = 0.12; const dv = Math.max(0.6, 0.06 * k);
      return <g><path d={`M${U(u)} ${Z(H)} L${U(u)} ${Z(zTop + 0.4)} A${r * k} ${r * k} 0 0 0 ${U(u + 2 * r)} ${Z(zTop + 0.4)} L${U(u + 2 * r)} ${Z(zTop + 0.28)}`} fill="none" stroke="#0b4fa8" strokeWidth={dv} />
        <HaloText x={U(u + 2 * r) + 1.5} y={Z(zTop + 0.4)} fontSize={1.6}>Ventilasi GIP Ø2"</HaloText></g>; })()}
    {/* pipa */}
    {g.pipes.map((pp, i) => {
      const dk = Math.max(0.7, pp.d / 1000 * k); const tap = pp.kind === 'tap';
      if (pp.wall === lw || pp.wall === rw) {
        const left = pp.wall === lw; const ext = tap ? 0.2 : STUB;
        const u1 = left ? -tw - ext : span - 0.12, u2 = left ? 0.12 : span + tw + ext; const uo = left ? u1 : u2; const ui = left ? u2 : u1;
        const firstTap = tap && g.pipes.findIndex(x => x.kind === 'tap' && x.wall === pp.wall) === i;
        if (tap && !A && Math.abs(pp.pos - g.cutX) > 0.05) return null;
        return <g key={i}>
          <rect x={U(u1)} y={Z(pp.z) - dk / 2} width={(u2 - u1) * k} height={dk} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />
          {pp.kind === 'of' && <rect x={U(uo) - (left ? 0 : dk)} y={Z(pp.z) - dk / 2} width={dk} height={0.45 * k} fill="#dbe8fb" stroke="#0b4fa8" strokeWidth={0.25} />}
          {pp.valve && <DedSymbol type="gate_valve" x={U(left ? -tw - 0.3 : span + tw + 0.3)} y={Z(pp.z)} s={Math.max(0.7, dk / 2.2)} />}
          {pp.strainer && <rect x={U(ui) - (left ? 0 : 1.6)} y={Z(pp.z) - dk / 2 - 0.4} width={1.6} height={dk + 0.8} fill="url(#pat-gravel)" stroke="#000" strokeWidth={0.15} />}
          {tap && <g><line x1={U(uo)} x2={U(uo)} y1={Z(pp.z)} y2={Z(pp.z) + 2.2} stroke="#000" strokeWidth={0.45} /><line x1={U(uo) - 1} x2={U(uo) + 1} y1={Z(pp.z) - 1.6} y2={Z(pp.z) - 1.6} stroke="#000" strokeWidth={0.45} /><line x1={U(uo)} x2={U(uo)} y1={Z(pp.z) - 1.6} y2={Z(pp.z)} stroke="#000" strokeWidth={0.3} /></g>}
          {(!tap || firstTap || !A) && <HaloText x={U(uo) + (left ? 0.3 : -0.3)} y={Z(pp.z) - dk / 2 - (tap ? 2.4 : 0.8)} fontSize={1.6} textAnchor={left ? 'start' : 'end'}>{pp.label} Ø{pp.d}</HaloText>}
        </g>;
      }
      const shown = ['in', 'of'].includes(pp.kind) && g.pipes.filter(x => x.kind === pp.kind && x.wall === pp.wall).indexOf(pp) === 0;
      return <g key={i}><circle cx={U(pp.pos)} cy={Z(pp.z)} r={Math.max(0.5, dk / 2)} fill="#fff" stroke="#0b4fa8" strokeWidth={0.25} strokeDasharray="0.6 0.4" />
        {shown && <HaloText x={U(pp.pos) + dk / 2 + 0.8} y={Z(pp.z) + (pp.kind === 'dr' ? -1.2 : 2.6)} fontSize={1.5}>{pp.kind === 'tap' ? 'Kran' : pp.label} Ø{pp.d}</HaloText>}</g>;
    })}
    {g.float && A && (() => { const pin = g.pipes.find(x => x.kind === 'in'); if (!pin) return null; const r = Math.max(0.8, 0.07 * k);
      return <g><line x1={U(0.12)} y1={Z(pin.z)} x2={U(0.42)} y2={Z(Hw) - r} stroke="#000" strokeWidth={0.3} /><circle cx={U(0.42)} cy={Z(Hw) - r} r={r} fill="#fff" stroke="#000" strokeWidth={0.3} />
        <HaloText x={U(0.42) + r + 0.8} y={Z(Hw) - r - 1.4} fontSize={1.6}>Katup pelampung</HaloText></g>; })()}
    {A && g.weep && <g>{Array.from({ length: Math.max(1, Math.floor((Hw - 0.05) / 0.2)) }).map((_, j) => { const z = 0.15 + j * 0.2; return <g key={j}>
      <rect x={U(-tw) - 0.1} y={Z(z) - 0.4} width={tw * k + 0.2} height={0.8} fill="#fff" stroke="#000" strokeWidth={0.1} />
      <line x1={U(-tw - ov - 0.7)} x2={U(-tw) - 0.5} y1={Z(z)} y2={Z(z)} stroke="#0b4fa8" strokeWidth={0.25} markerEnd="url(#arr)" /></g>; })}
      <HaloText x={U(-tw - ov - 0.35)} y={Z(Hw) - 1.2} fontSize={1.7} textAnchor="middle" fill="#0b4fa8">Mata air</HaloText></g>}
    {/* label struktur */}
    {fbBand
      ? <HaloText x={U(span / 2)} y={Z((Hw + H) / 2) + 0.7} fontSize={1.6} textAnchor="middle">Tul. dinding {p.rebarWall} (2 lapis) · atap {p.rebarRoof}</HaloText>
      : <HaloText x={U(span / 2)} y={Z(zTop) - 1.2 - (Math.abs(span / 2 - mhU) * k < 22 ? 5.5 : 0)} fontSize={1.6} textAnchor="middle">Tul. dinding {p.rebarWall} · atap {p.rebarRoof}</HaloText>}
    <HaloText x={U(span / 2)} y={Z(zBot) + 2.4} fontSize={1.6} textAnchor="middle">Pelat dasar t={fmt(tb, 2)} · {p.rebarSlab} · lantai kerja t={fmt(tlk, 2)}</HaloText>
    {/* elevasi */}
    <ElevMark x={U(span * 0.42)} y={Z(Hw)} text={`MAT ${elevTxt(elev(Hw))}`} color="#0b4fa8" below />
    <ElevMark x={U(span * 0.1) + 1.5} y={Z(0)} text={elevTxt(elev(0))} />
    <ElevMark x={U(A ? span * 0.5 : span * 0.82)} y={Z(zTop)} text={elevTxt(elev(zTop))} />
    <ElevMark x={U(-tw - ov - soilW) + 2} y={Z(zg)} text={`MT ${elevTxt(g.ground)}`} />
    {/* dimensi */}
    {[[-tb, 0, fmt(tb, 2)], [0, Hw, fmt(Hw, 2)], [Hw, H, fmt(g.fb, 2)], [H, zTop, fmt(tr, 2)]].map(([z1, z2, t], i) =>
      <DimLine key={i} x1={U(-tw - ov - soilW)} y1={Z(z2)} x2={U(-tw - ov - soilW)} y2={Z(z1)} off={-3.5} vertical size={1.5} text={(z2 - z1) * k >= 2.4 ? t : ''} />)}
    <DimLine x1={U(-tw - ov - soilW)} y1={Z(zTop)} x2={U(-tw - ov - soilW)} y2={Z(-tb)} off={-8.5} vertical size={1.7} text={fmt(g.Htot, 2)} />
    {[[-tw, 0, fmt(tw, 2)], [0, span, fmt(span, 2)], [span, span + tw, fmt(tw, 2)]].map(([u1, u2, t], i) =>
      <DimLine key={i} x1={U(u1)} y1={Z(zBot)} x2={U(u2)} y2={Z(zBot)} off={(zBot - bot) * k + 3.5} size={1.6} text={(u2 - u1) * k >= 2.4 ? t : ''} />)}
    <ViewTitle x={ox + w / 2} y={oy + h - 6} title={`POTONGAN ${axis} – ${axis}`} S={S} />
  </g>;
}

function StructTables({ g, q, x, y, w }) {
  const p = g.p; const rh = 4.3;
  const data = [
    ['Dimensi dalam (P × L)', `${fmt(g.L, 2)} × ${fmt(g.B, 2)} m`],
    ['Tinggi air / tinggi jagaan', `${fmt(g.Hw, 2)} / ${fmt(g.fb, 2)} m`],
    ['Kapasitas efektif', `${fmt(q.cap, 2)} m³`],
    ...(q.need !== null ? [['Kebutuhan tampungan', `${fmt(q.need, 1)} m³ → ${q.cap >= q.need ? 'MEMENUHI' : 'KURANG'}`]] : []),
    ['Tebal dinding / dasar / atap', `${fmt(g.tw, 2)} / ${fmt(g.tb, 2)} / ${fmt(g.tr, 2)} m`],

  const vol = [

    ['Bekisting', q.formwork, 'm²'], ['Plester kedap air (dalam)', q.plIn, 'm²'], ['Plester luar', q.plOut, 'm²'], ['Urugan tanah kembali', q.urugan, 'm³'],
    ...(g.filter ? [['Filter kerikil & ijuk', q.filterV, 'm³']] : []),

      <text x={x + 1.5} y={y + 4 + i * rh + 3}>{r[0]}</text><text x={x + w - 1.5} y={y + 4 + i * rh + 3} textAnchor="end" fontWeight={600} fill={String(r[1]).includes('KURANG') ? '#b91c1c' : '#000'}>{r[1]}</text></g>)}
    <text x={x} y={y2 - 2} fontSize={2.5} fontWeight={700}>VOLUME PEKERJAAN</text>
    <rect x={x} y={y2} width={w} height={rh} fill="#e6e6e6" stroke="#000" strokeWidth={0.2} />
    <text x={x + 1.5} y={y2 + 3} fontWeight={700}>Uraian</text><text x={x + w - 22} y={y2 + 3} textAnchor="end" fontWeight={700}>Volume</text><text x={x + w - 1.5} y={y2 + 3} textAnchor="end" fontWeight={700}>Sat.</text>
    {vol.map((r, i) => { const yy = y2 + rh * (i + 1); return <g key={i}><rect x={x} y={yy} width={w} height={rh} fill="#fff" stroke="#000" strokeWidth={0.2} />
      <text x={x + 1.5} y={yy + 3}>{r[0]}</text><text x={x + w - 22} y={yy + 3} textAnchor="end">{fmt(r[1], r[2] === 'kg' ? 1 : 3)}</text><text x={x + w - 1.5} y={yy + 3} textAnchor="end">{r[2]}</text></g>; })}
  </g>;
}
const STRUCT_NOTES = {

function structLegend(g) {

      <select id="st-node" className="tp-field" value={st.nodeId || ''} onChange={e => upd({ nodeId: e.target.value })}>

      {num('Hw', 'Tinggi air', 0.05, 0.1)}{num('fb', 'Tinggi jagaan', 0.05)}
      {num('tw', 'Tebal dinding', 0.01, 0.08)}{num('tb', 'Tebal pelat dasar', 0.01, 0.08)}
      {num('tr', 'Tebal pelat atap', 0.01, 0.06)}{num('tlk', 'Tebal lantai kerja', 0.01)}
      {num('embed', 'Kedalaman tertanam', 0.05)}{num('mh', 'Ukuran manhole', 0.05, 0.3)}

      {st.type === 'hidran' && num('taps', 'Jumlah kran (1–8)', 1, 1)}
      {st.type === 'broncaptering' && num('gravel', 'Panjang zona filter', 0.05, 0.2)}
      {st.type === 'reservoir' && num('needPct', 'Tampungan (% Q harian)', 1, 1)}

    </div>
    <H>Perpipaan (mm)</H>

      {st.type !== 'hidran' && dia('dOut', 'Ø outlet')}{dia('dOf', 'Ø peluap')}{dia('dDr', 'Ø penguras')}
    </div>
    <H>Penulangan</H>
    <div className="grid grid-cols-2 gap-2">
      {txt('rebarWall', 'Tulangan dinding')}{txt('rebarSlab', 'Tulangan pelat dasar')}{txt('rebarRoof', 'Tulangan pelat atap')}{num('steelRatio', 'Rasio besi (kg/m³)', 5, 40)}
    </div>
    <div className="rounded-md bg-ground px-3 py-2 grid grid-cols-2 gap-y-1 text-[12px]">
      <span className="text-slate-500">Kapasitas efektif</span><span className="text-right font-mono num">{fmt(q.cap, 2)} m³</span>
      {q.need !== null && <><span className="text-slate-500">Kebutuhan tampungan</span><span className="text-right"><span className={'pill ' + (q.cap >= q.need ? 's-ok' : 's-high')}>{fmt(q.need, 1)} m³</span></span></>}
      <span className="text-slate-500">Beton K-250</span><span className="text-right font-mono num">{fmt(q.concrete, 2)} m³</span>
      <span className="text-slate-500">Baja tulangan</span><span className="text-right font-mono num">{fmt(q.steel, 0)} kg</span>
      <span className="text-slate-500">Elevasi MAT</span><span className="text-right font-mono num">{elevTxt(g.floor + g.Hw)}</span>
    </div>
    <div className="flex gap-2">
      <Btn icon="FilePlus2" variant="outline" onClick={onDuplicate}>Duplikat</Btn>
      {confirmDel ? <><Btn variant="danger" icon="Trash2" onClick={onDelete}>Ya, hapus</Btn><Btn variant="outline" onClick={() => setConfirmDel(false)}>Batal</Btn></>
        : <Btn icon="Trash2" variant="danger" onClick={() => setConfirmDel(true)}>Hapus</Btn>}
    </div>
  </div>;
}

function DedWorkspace({ project, setProject, hyd, boq, onPrint }) {
  const ded = project.ded; const setDed = (k, v) => setProject(p => ({ ...p, ded: { ...p.ded, [k]: v } }));
  const setMeta = (k, v) => setProject(p => ({ ...p, meta: { ...p.meta, [k]: v } }));
  const [addType, setAddType] = useState('reservoir');
  const ends = project.nodes.filter(n => hyd.nodes[n.id].dist > 0);
  const path = buildPath(project, hyd, ded.lsEnd);
  const sheets = [['layout', 'Denah Skema Jaringan', 'Map'], ['long', 'Potongan Memanjang', 'Activity'], ['cross', 'Potongan Melintang', 'Layers']];
  const structs = boq.structures; const extras = extraSheets(project, hyd, boq); const total = 3 + extras.length;
  const exIdx = extras.findIndex(x => x.key === ded.sheet); const ex = exIdx >= 0 ? extras[exIdx] : null;
  const curIdx = String(ded.sheet).startsWith('st:') ? structs.findIndex(x => x.st.id === ded.sheet.slice(3)) : -1;
  const cur = curIdx >= 0 ? structs[curIdx] : null;
  const sheet = ex ? ded.sheet : (sheets.some(x => x[0] === ded.sheet) ? ded.sheet : 'layout');
  const addStructure = () => { const st = newStructure(addType, project.structures || [], { params: { ...STRUCT_DEFAULTS.common, ...STRUCT_DEFAULTS[addType], elev: project.nodes[0] ? +project.nodes[0].elev : 100 } });
    setProject(p => ({ ...p, structures: [...(p.structures || []), st], ded: { ...p.ded, sheet: 'st:' + st.id } })); };
  const dupStructure = (st) => { const c = { ...st, id: uid('s'), nodeId: '', label: nextLabel(project.structures, STRUCT_TYPES[st.type].short + '-'), params: { ...st.params, elev: structGeom(st, project).ground } };
    setProject(p => ({ ...p, structures: [...p.structures, c], ded: { ...p.ded, sheet: 'st:' + c.id } })); };
  const delStructure = (id) => setProject(p => ({ ...p, structures: p.structures.filter(x => x.id !== id), ded: { ...p.ded, sheet: 'layout' } }));
  const sheetBtn = (key, no, label, icon, sub) => <button key={key} type="button" onClick={() => setDed('sheet', key)} className={`w-full flex items-center gap-2 rounded-md px-3 py-2 text-[13px] text-left border ${sheet === key ? 'bg-aqua-600 text-white border-aqua-600' : 'border-line hover:border-aqua-400'}`}>
    <span className="font-mono text-[11px] opacity-70">{String(no).padStart(2, '0')}</span><Icon name={icon} size={15} /><span className="min-w-0 flex-1 truncate">{label}{sub && <span className="opacity-70"> · {sub}</span>}</span></button>;
  return <div className="flex flex-col lg:flex-row h-full min-h-0 overflow-y-auto lg:overflow-hidden">
    <aside className="lg:w-80 shrink-0 bg-white border-b lg:border-b-0 lg:border-r border-line p-4 space-y-4 lg:overflow-y-auto">
      <div>
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Gambar jaringan</div>
        <div className="space-y-1">{sheets.map(([k, l, ic], i) => sheetBtn(k, i + 1, l, ic))}</div>
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5 mt-3">Bangunan pelengkap</div>
        <div className="space-y-1">{extras.map((x, i) => x.group === 'Bangunan pelengkap' && sheetBtn(x.key, 4 + i, x.label, x.icon, x.sub))}</div>
        <div className="flex gap-1.5 mt-2">
          <select id="st-add-type" className="tp-field" value={addType} onChange={e => setAddType(e.target.value)}>{Object.entries(STRUCT_TYPES).map(([k, t]) => <option key={k} value={k}>{t.label}</option>)}</select>
          <Btn icon="CirclePlus" variant="primary" onClick={addStructure} title="Tambah bangunan">Tambah</Btn>
        </div>
        {extras.some(x => x.group !== 'Bangunan pelengkap') && <><div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5 mt-3">Sumber & pengolahan air</div>
          <div className="space-y-1">{extras.map((x, i) => x.group !== 'Bangunan pelengkap' && sheetBtn(x.key, 4 + i, x.label, x.icon, x.sub))}</div></>}
        <p className="text-[11px] text-slate-500 mt-1.5">Sumur bor dan desain pengolahan diatur di tab Olah Air.</p>
      </div>
      <div className="space-y-2 border-t border-line pt-3">
        {cur ? <StructureEditor key={cur.st.id} s={cur} project={project} setProject={setProject} onDelete={() => delStructure(cur.st.id)} onDuplicate={() => dupStructure(cur.st)} />
          : <><div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Opsi gambar jaringan</div>
            <Field label="Jalur potongan memanjang"><select id="ded-lsend" className="tp-field" value={ded.lsEnd || path?.endId || ''} onChange={e => setDed('lsEnd', e.target.value)}>{ends.map(n => <option key={n.id} value={n.id}>{path?.points[0].node.label || 'R'} → {n.label}</option>)}</select></Field>
            <Field label="Interval patok STA (m)"><select id="ded-sta" className="tp-field" value={project.settings.staInterval} onChange={e => setProject(p => ({ ...p, settings: { ...p.settings, staInterval: +e.target.value } }))}>{[0, 25, 50, 100, 200].map(v => <option key={v} value={v}>{v === 0 ? 'Hanya titik node' : v + ' m'}</option>)}</select></Field>
            <Field label="Diameter potongan melintang"><select id="ded-cs" className="tp-field" value={ded.csDiameter || ''} onChange={e => setDed('csDiameter', +e.target.value)}><option value="">Terbesar ({boq.pipeGroups.length ? Math.max(...boq.pipeGroups.map(g => g.diameter)) : '-'} mm)</option>{[...new Set(boq.pipeGroups.map(g => g.diameter))].map(d => <option key={d} value={d}>Ø{d} mm</option>)}</select></Field></>}
      </div>
      <div className="space-y-2 border-t border-line pt-3">
        <Field label="Ukuran kertas cetak"><div className="flex rounded-md border border-line overflow-hidden text-[12px]">{['A3', 'A4'].map(p => <button key={p} type="button" onClick={() => setDed('paper', p)} className={`flex-1 py-1.5 ${ded.paper === p ? 'bg-deep text-white' : 'bg-white text-slate-600'}`}>{p} lanskap</button>)}</div></Field>
        <Btn icon="Printer" variant="primary" className="w-full justify-center" onClick={() => onPrint('ded')}>Cetak semua gambar DED ({total} lembar)</Btn>
        <p className="text-[11px] text-slate-500">Menu aplikasi disembunyikan otomatis; pilih "Simpan sebagai PDF" di dialog cetak untuk berkas PDF.</p>
      </div>
      <details className="border-t border-line pt-3">
        <summary className="text-[11px] font-semibold uppercase tracking-wide text-slate-500 cursor-pointer">Kop gambar</summary>
        <div className="space-y-2 mt-2">{[['name', 'Nama proyek'], ['location', 'Lokasi'], ['owner', 'Pemilik / instansi'], ['fiscal', 'Sumber dana / tahun'], ['consultant', 'Konsultan perencana'], ['drawnBy', 'Digambar'], ['checkedBy', 'Diperiksa'], ['approvedBy', 'Disetujui'], ['drawingCode', 'Kode gambar'], ['date', 'Tanggal']].map(([k, l]) =>
          <Field key={k} label={l}><input id={'meta-' + k} className="tp-field" value={project.meta[k] || ''} onChange={e => setMeta(k, e.target.value)} /></Field>)}</div>
      </details>
    </aside>
    <div className="flex-1 lg:overflow-auto p-3 lg:p-6 min-w-0 bg-[#dfe6e4] shrink-0 lg:shrink">
      <div className="paper mx-auto max-w-[1400px] overflow-x-auto">
        {sheet === 'layout' && <SheetLayout project={project} hyd={hyd} />}
        {sheet === 'long' && <SheetLongSection project={project} hyd={hyd} endId={ded.lsEnd} />}
        {sheet === 'cross' && <SheetCrossSection project={project} boq={boq} diameter={ded.csDiameter} />}
        {ex && ex.render(4 + exIdx, total)}
      </div>
    </div>
  </div>;
}

    <div className="print-sheet" style={sheetStyle}><SheetLayout project={project} hyd={hyd} /></div>
    <div className="print-sheet" style={sheetStyle}><SheetLongSection project={project} hyd={hyd} endId={project.ded.lsEnd} /></div>
    <div className="print-sheet" style={sheetStyle}><SheetCrossSection project={project} boq={boq} diameter={project.ded.csDiameter} /></div>

    </div>
    <h2>1. Ringkasan</h2>
    <table><tbody>
      {[['Jumlah node / segmen pipa', `${project.nodes.length} node / ${project.pipes.length} segmen`], ['Total panjang pipa', `${fmt(boq.totalLength, 2)} m (+${s.wastePct}% waste = ${fmt(boq.totalLength * boq.waste, 2)} m)`],
        ['Total kebutuhan air', `${fmt(hyd.totalDemand, 2)} L/dtk (${fmt(hyd.totalDemand * 86.4, 1)} m³/hari)`], ['Tekanan minimum', hyd.minP ? `${fmt(hyd.nodes[hyd.minP.id].pressure, 2)} mka di ${hyd.minP.label}` : '-'],
        ['Kecepatan maksimum', hyd.maxV ? `${fmt(hyd.pipes[hyd.maxV.id].v, 2)} m/s di ${hyd.maxV.label}` : '-'], ['Jumlah peringatan', `${hyd.warnings.length}`],
        ['Total RAB (dibulatkan)', `${rp(rab.rounded)}`], ['Terbilang', terbilang(rab.rounded)]].map(([a, b]) => <tr key={a}><td style={{ width: '38%' }}>{a}</td><td><b>{b}</b></td></tr>)}
    </tbody></table>
    <h3>Kriteria desain</h3>
    <table><tbody><tr><td>Rumus kehilangan tekan</td><td>Hazen-Williams: hf = 10,67·L·Q^1,852 / (C^1,852·D^4,87); C HDPE 130, PVC 140, GIP 110</td></tr>
      <tr><td>Kecepatan aliran</td><td>{s.vMin} – {s.vMax} m/s</td></tr><tr><td>Sisa tekanan</td><td>minimal {s.pMin} mka, maksimal {s.pMax} mka</td></tr>
      <tr><td>Dimensi galian</td><td>W {fmt(s.trenchWidth, 2)} m × H {fmt(s.trenchDepth, 2)} m; pasir alas {fmt(s.sandBed, 2)} m; pasir di atas pipa {fmt(s.sandCover, 2)} m</td></tr></tbody></table>

    {(boq.pumps.length > 0 || boq.treat.length > 0) && <><h3>Sistem pompa & pengolahan air</h3>

function teamStats(project, hyd) {
  const rows = new Map(); const get = (by) => { const k = by ? by.id : '_'; if (!rows.has(k)) rows.set(k, { name: by ? by.name : 'Tanpa identitas petugas', role: by?.role || '', nodes: 0, structs: 0, pipes: 0, pipeLen: 0, tracks: 0, trackLen: 0, edits: 0 }); return rows.get(k); };
  (project.team || []).forEach(t => get({ id: t.id, name: t.name, role: t.role }));
  project.nodes.forEach(n => { get(n.by).nodes++; if (n.ed) get(n.ed).edits++; });
  (project.structures || []).forEach(x => { get(x.by).structs++; if (x.ed) get(x.ed).edits++; });
  project.pipes.forEach(x => { const r = get(x.by); r.pipes++; r.pipeLen += hyd.pipes[x.id]?.length || 0; if (x.ed) get(x.ed).edits++; });
  (project.tracks || []).forEach(t => { const r = get(t.by); r.tracks++; r.trackLen += trackLength(t.points); });
  return [...rows.values()].filter(r => r.nodes + r.structs + r.pipes + r.tracks + r.edits > 0 || r.name !== 'Tanpa identitas petugas');
}

function parseRows(text, defKind) {
  return text.split(/\r?\n/).map((line, i) => ({ line, i })).filter(x => x.line.trim() && !x.line.trim().startsWith('#')).map(({ line, i }) => {
    let cols = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : (line.match(/,/g) || []).length >= 2 ? line.split(',') : [line];
    cols = cols.map(c => c.trim()).filter(c => c !== '');
    let coord = null; const used = new Set();
    for (let n = 1; n <= 3 && !coord; n++) for (let k = 0; k + n <= cols.length && !coord; k++) { const r = parseCoord(cols.slice(k, k + n).join(' ')); if (r && !r.error) { coord = r; for (let j = k; j < k + n; j++) used.add(j); } }
    let label, kind, elev, demand;
    cols.forEach((c, j) => { if (used.has(j)) return; const num = c.replace(',', '.');
      if (/^-?\d+(\.\d+)?$/.test(num)) { if (elev === undefined) elev = +num; else if (demand === undefined) demand = +num; return; }
      const g = guessKind(c);
      if (!label && /^[A-Za-z]{1,4}[-\s]?\d+$/.test(c)) { label = c; if (!kind && g !== 'junction') kind = g; }
      else if (!kind && (g !== 'junction' || /junction|percabangan|tee/i.test(c))) kind = g; else if (!label) label = c; });
    return { line: i + 1, lat: coord?.lat, lng: coord?.lng, label, kind: kind || defKind, elev, demand, error: coord ? null : 'koordinat tidak terbaca' };
  });
}

      const h = await hashPw(password); const first = users.length === 0;

  // Elevasi otomatis (DEM) untuk node & bangunan yang belum punya elevasi pada koordinatnya
  useEffect(() => {
    if (project.settings.elevSource === 'off') { setElevStatus({ state: 'idle', pending: 0 }); return; }
    const need = [];
    project.nodes.forEach(n => { if (n.elevAuto && n.elevKey !== demKey(n.lat, n.lng)) need.push({ kind: 'n', id: n.id, lat: n.lat, lng: n.lng }); });
    (project.structures || []).forEach(st => { if (!st.nodeId && st.elevAuto && st.lat != null && st.elevKey !== demKey(st.lat, st.lng)) need.push({ kind: 's', id: st.id, lat: st.lat, lng: st.lng }); });
    if (!need.length) { setElevStatus(s => s.state === 'loading' || s.pending ? { state: 'ok', pending: 0, at: new Date() } : s); return; }
    const wait = Math.max(600, DEM.failUntil - Date.now());
    if (DEM.failUntil > Date.now()) setElevStatus(s => ({ ...s, state: 'error', pending: need.length }));
    const t = setTimeout(async () => {
      if (elevBusy.current) return; elevBusy.current = true; setElevStatus({ state: 'loading', pending: need.length });
      try {
        const vals = await fetchDem(need); DEM.failUntil = 0;
        const map = new Map(need.map((q, i) => [q.kind + q.id, { v: vals[i], key: demKey(q.lat, q.lng) }]));
        patchProject(p => ({ ...p,
          nodes: p.nodes.map(n => { const r = map.get('n' + n.id); return r && n.elevAuto && demKey(n.lat, n.lng) === r.key && isFinite(r.v) ? { ...n, elev: round2(r.v), elevSrc: 'dem', elevKey: r.key } : n; }),
          structures: (p.structures || []).map(x => { const r = map.get('s' + x.id); return r && x.elevAuto && x.lat != null && demKey(x.lat, x.lng) === r.key && isFinite(r.v) ? { ...x, elevSrc: 'dem', elevKey: r.key, params: { ...x.params, elev: round2(r.v) } } : x; }) }));
        setElevStatus({ state: 'ok', pending: 0, at: new Date() });
      } catch (e) {
        DEM.failUntil = Date.now() + 30000; setElevStatus({ state: 'error', pending: need.length });
        setTimeout(() => setElevRetry(x => x + 1), 30500);
      } finally { elevBusy.current = false; }
    }, wait);
    return () => clearTimeout(t);
  }, [project.nodes, project.structures, project.settings.elevSource, elevRetry]);
  const openDed = (id) => { setProject(p => ({ ...p, ded: { ...p.ded, sheet: 'st:' + id } })); setTab('ded'); };
  const fileBase = () => (project.meta.name || 'proyek').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 50);
  const shareData = async (kind) => {
    const isGpx = kind === 'gpx'; const name = fileBase() + (isGpx ? '.gpx' : '.json');
    const text = isGpx ? buildGpx(project) : JSON.stringify(project, null, 2);
    try {
      const file = new File([text], name, { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: project.meta.name, text: 'Data survei TirtaPlan' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    downloadText(name, text, isGpx ? 'application/gpx+xml' : 'application/json');
    setToast('Perangkat ini tidak mendukung menu Bagikan; berkas diunduh.');
  };
  const field = { officer, pickOfficer: () => setPickOfficer({ then: () => {} }), mobile, elevStatus, prefs, setPrefs, activeNode, setActiveNode, createPoint, gps, rec, startRec, stopRec, markHere, follow, setFollow, focus, setFocus, openCoord: setCoordTab, openDed };

  const hyd = useMemo(() => computeHydraulics(project), [project]);
  const boq = useMemo(() => computeBoQ(project, hyd), [project, hyd]);
  const rab = useMemo(() => buildRAB(project, boq), [project, boq]);

  useEffect(() => { const t = setTimeout(() => { try { localStorage.setItem(PKEY, JSON.stringify(project)); setSavedAt(new Date()); } catch (e) { setSavedAt('err'); } }, 500); return () => clearTimeout(t); }, [project]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2600); return () => clearTimeout(t); }, [toast]);
  useEffect(() => {
    const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); } };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  });
  useEffect(() => {
    if (!printMode) return;
    const paper = project.ded.paper === 'A4' ? 'A4' : 'A3';
    const st = document.createElement('style'); st.id = 'tp-page';
    st.textContent = `@page { size: A4 portrait; margin: 14mm 12mm; } @page sheet { size: ${paper} landscape; margin: 6mm; }`;
    document.head.appendChild(st);
    const done = () => { setPrintMode(null); st.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    const t = setTimeout(() => window.print(), 400);
    return () => clearTimeout(t);
  }, [printMode]);

  const saveFile = () => {
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (project.meta.name || 'proyek').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setToast('Proyek disimpan sebagai berkas .json');
  };
  const loadFile = (e) => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const data = JSON.parse(r.result); if (!Array.isArray(data.nodes)) throw new Error(); setPendingLoad({ data, name: f.name }); } catch (err) { setToast('Berkas tidak valid: pastikan ini berkas .json dari TirtaPlan'); } };
    r.readAsText(f); e.target.value = '';
  };

  const tabs = [
    { id: 'map', n: '1', label: 'Pemetaan & Asesmen', short: 'Peta', icon: 'Map' },
    { id: 'hyd', n: '2', label: 'Analisis Hidrolis', short: 'Hidrolis', icon: 'Gauge' },
    { id: 'wt', n: '3', label: 'Pompa & Olah Air', short: 'Olah Air', icon: 'FlaskConical' },
    { id: 'boq', n: '4', label: 'BoQ & RAB', short: 'RAB', icon: 'Calculator' },
    { id: 'ded', n: '5', label: 'DED & Gambar Teknik', short: 'DED', icon: 'DraftingCompass' },
  ];
  const s = project.settings;
  const nCrit = hyd.warnings.filter(w => w.level === 'high').length;

  return <>
    <div id="app-shell" className="h-full flex flex-col">
      {mobile ? <header className="bg-deep text-white shrink-0" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div className="flex items-center gap-2 px-3 py-2">
          <div className="w-8 h-8 rounded-md bg-aqua-500 flex items-center justify-center shrink-0"><Icon name="Droplets" size={18} /></div>
          <button type="button" onClick={() => setDialog(true)} className="min-w-0 flex-1 text-left">
            <div className="text-[10px] tracking-[0.14em] uppercase text-aqua-200 font-semibold">TirtaPlan Studio</div>
            <div className="text-[13px] font-semibold truncate">{project.meta.name}</div></button>
          {rec && <span className="flex items-center gap-1 text-[10px] font-bold rounded-full px-2 py-0.5 bg-red-500"><span className="tp-rec w-1.5 h-1.5 rounded-full bg-white" />REC</span>}
          <button type="button" disabled={!histLen} onClick={undo} className="p-2 rounded disabled:opacity-30" aria-label="Urungkan"><Icon name="Undo2" size={20} /></button>
          <button type="button" onClick={() => setMenuOpen(true)} className="p-2 -mr-1 rounded" aria-label="Menu"><Icon name="Menu" size={22} /></button>
        </div>
        <nav className="flex">
          {tabs.map(t => <button key={t.id} type="button" onClick={() => setTab(t.id)}
            className={`flex-1 flex items-center justify-center gap-1 py-2 text-[12px] font-semibold border-b-2 ${tab === t.id ? 'border-aqua-400 text-white bg-white/5' : 'border-transparent text-slate-300'}`}>
            <Icon name={t.icon} size={14} />{t.short}{t.id === 'hyd' && hyd.warnings.length > 0 && <span className={`text-[9px] font-bold rounded-full px-1 ${nCrit ? 'bg-red-500' : 'bg-amber-400 text-ink'}`}>{hyd.warnings.length}</span>}</button>)}
        </nav>
      </header> : <header className="bg-deep text-white shrink-0">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-8 h-8 rounded-md bg-aqua-500 flex items-center justify-center shrink-0"><Icon name="Droplets" size={18} /></div>
            <div className="min-w-0">
              <div className="text-[11px] tracking-[0.14em] uppercase text-aqua-200 font-semibold">TirtaPlan Studio</div>
              <button type="button" onClick={() => setDialog(true)} className="block text-[14px] font-semibold truncate max-w-[52vw] lg:max-w-[560px] hover:underline text-left" title="Ubah data proyek">{project.meta.name}</button>
            </div>
          </div>
          <div className="hidden xl:flex bg-white rounded-md px-2.5 py-1"><OrgLogos meta={project.meta} height={26} gap={12} /></div>
          <div className="flex-1" />
          {user.admin && <Btn variant="dark" icon="UserRound" onClick={() => setUserAdmin(true)} title="Setujui pendaftar & atur akses">Kelola pengguna</Btn>}
          <Btn variant="dark" icon="X" onClick={logout} title={`Keluar (${user.email})`}>Keluar</Btn>
          <button type="button" onClick={() => setPickOfficer({ then: null })} className="flex items-center gap-1.5 rounded-md border border-white/15 px-2.5 py-1.5 text-[12.5px] hover:bg-white/10" title="Ganti petugas di perangkat ini">
            <Icon name="UserRound" size={15} />{officer ? <span className="max-w-[160px] truncate">{officer.name}</span> : <span className="text-amber-300">Pilih petugas</span>}</button>
          <div className="flex flex-wrap items-center gap-1">
            <Btn variant="dark" icon="FilePlus2" onClick={() => setConfirm({ text: 'Buat proyek baru yang kosong? Proyek saat ini akan diganti (simpan dulu ke .json bila perlu).', yes: () => { stopRec(); setActiveNode(null); setProject(createEmptyProject(), { noStamp: true }); setSelection(null); setTab('map'); } })}>Baru</Btn>
            <Btn variant="dark" icon="BookOpen" onClick={() => setConfirm({ text: 'Muat ulang Proyek Contoh desa? Proyek saat ini akan diganti.', yes: () => { stopRec(); setActiveNode(null); setProject(createExampleProject(), { noStamp: true }); setSelection(null); } })}>Contoh</Btn>
            <Btn variant="dark" icon="Undo2" disabled={!histLen} onClick={undo} title="Urungkan (Ctrl+Z)">Urungkan</Btn>
            <span className="w-px h-6 bg-white/15 mx-1" />
            <Btn variant="dark" icon="Download" onClick={saveFile} title="Simpan proyek ke berkas .json (Ctrl+S)">Simpan .json</Btn>
            <Btn variant="dark" icon="Upload" onClick={() => fileRef.current.click()}>Muat .json</Btn>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={loadFile} />
            <Btn variant="dark" icon="Smartphone" onClick={() => setDeviceDlg(true)} title="Buka aplikasi di HP / tablet">Buka di HP</Btn>
            <span className="w-px h-6 bg-white/15 mx-1" />
            <Btn variant="dark" icon="FileText" onClick={() => setPrintMode('report')}>Cetak laporan</Btn>
            <Btn variant="dark" icon="Printer" onClick={() => setPrintMode('ded')}>Cetak DED</Btn>
          </div>
        </div>
        <nav className="flex overflow-x-auto px-2">
          {tabs.map(t => <button key={t.id} type="button" onClick={() => setTab(t.id)}
            className={`flex items-center gap-2 px-4 py-2.5 text-[13px] font-medium whitespace-nowrap border-b-2 ${tab === t.id ? 'border-aqua-400 text-white bg-white/5' : 'border-transparent text-slate-300 hover:text-white'}`}>
            <span className={`font-mono text-[11px] w-5 h-5 rounded flex items-center justify-center ${tab === t.id ? 'bg-aqua-500 text-white' : 'bg-white/10'}`}>{t.n}</span><Icon name={t.icon} size={15} />{t.label}
            {t.id === 'map' && rec && <span className="ml-1 flex items-center gap-1 text-[10px] font-bold rounded-full px-1.5 bg-red-500 text-white"><span className="tp-rec w-1.5 h-1.5 rounded-full bg-white" />REC</span>}
            {t.id === 'hyd' && hyd.warnings.length > 0 && <span className={`ml-1 text-[10px] font-bold rounded-full px-1.5 ${nCrit ? 'bg-red-500' : 'bg-amber-400 text-ink'}`}>{hyd.warnings.length}</span>}
          </button>)}
        </nav>
      </header>}
      <main className="flex-1 min-h-0 relative">
        {tab === 'map' && <MapWorkspace project={project} setProject={setProject} hyd={hyd} selection={selection} setSelection={setSelection} field={field} />}
        {tab === 'hyd' && <HydraulicWorkspace project={project} setProject={setProject} hyd={hyd} setSelection={setSelection} goMap={() => setTab('map')} />}
        {tab === 'wt' && <WaterWorkspace project={project} setProject={setProject} hyd={hyd} boq={boq}
          openDedSheet={(key) => { setProject(p => ({ ...p, ded: { ...p.ded, sheet: key } })); setTab('ded'); }}
          goMapBorehole={() => { setPrefs(p => ({ ...p, type: 'borehole' })); setTab('map'); setToast('Pilih alat Gambar pipa, ketuk lokasi sumur bor, lalu sambungkan ke reservoir'); }} />}
        {tab === 'boq' && <BoqWorkspace project={project} setProject={setProject} boq={boq} rab={rab} />}
        {tab === 'ded' && <DedWorkspace project={project} setProject={setProject} hyd={hyd} boq={boq} onPrint={setPrintMode} />}
      </main>
      <footer className="shrink-0 bg-white border-t border-line px-4 py-1.5 hidden lg:flex flex-wrap items-center gap-x-5 gap-y-1 text-[12px] text-slate-600 num">
        <span className="flex items-center gap-1.5"><Icon name="Spline" size={13} />{project.nodes.length} node · {project.pipes.length} pipa · {fmt(hyd.totalLength, 1)} m</span>
        <span className="flex items-center gap-1.5"><Icon name="Droplets" size={13} />Q total {fmt(hyd.totalDemand)} L/dtk</span>
        <span className="flex items-center gap-1.5"><Icon name="Gauge" size={13} />P min {hyd.minP ? fmt(hyd.nodes[hyd.minP.id].pressure, 1) + ' mka' : '–'}</span>
        <span className="flex items-center gap-1.5"><Icon name="Calculator" size={13} />RAB {rp(rab.rounded)}</span>
        <span className="flex items-center gap-1.5"><Icon name="UserRound" size={13} />{officer ? officer.name : 'Petugas belum dipilih'}</span>
        <span className="flex-1" />
        {project.settings.elevSource !== 'off' && elevStatus.state !== 'idle' && <span className="flex items-center gap-1.5">
          {elevStatus.state === 'loading' ? <><Icon name="Mountain" size={13} className="text-aqua-600" />Mengambil elevasi DEM ({elevStatus.pending} titik)…</>
            : elevStatus.state === 'error' ? <><Icon name="TriangleAlert" size={13} className="text-amber-600" />Elevasi DEM tidak terjangkau; {elevStatus.pending} titik memakai perkiraan <button type="button" className="font-semibold text-aqua-700 hover:underline" onClick={() => { DEM.failUntil = 0; setElevRetry(x => x + 1); }}>Coba lagi</button></>
            : <><Icon name="Mountain" size={13} className="text-green-600" />Elevasi DEM terbaru</>}</span>}
        <span className="flex items-center gap-1.5">{savedAt === 'err' ? <><Icon name="TriangleAlert" size={13} className="text-amber-600" />Penyimpanan otomatis tidak tersedia di browser ini</> : savedAt ? <><Icon name="CircleCheck" size={13} className="text-green-600" />Tersimpan otomatis {savedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</> : 'Menyimpan…'}</span>
      </footer>
    </div>
    {pendingLoad && <div className="fixed inset-0 z-[2100] bg-black/40 flex items-center justify-center p-4" onClick={() => setPendingLoad(null)}>
      <div className="bg-white rounded-lg w-full max-w-md p-5 space-y-3" onClick={e => e.stopPropagation()}>
        <h2 className="font-semibold text-[15px]">Muat "{pendingLoad.name}"</h2>
        <p className="text-[13px] text-slate-600">Berkas berisi {pendingLoad.data.nodes.length} node, {(pendingLoad.data.pipes || []).length} pipa, {(pendingLoad.data.structures || []).length} bangunan, dan {(pendingLoad.data.tracks || []).length} jejak GPS.</p>
        <button type="button" className="w-full text-left rounded-md border border-line hover:border-aqua-400 p-3" onClick={() => { const r = mergeProject(project, pendingLoad.data); setProject(r.project, { noStamp: true }); setPendingLoad(null);
          setToast(`Digabung: +${r.stats.nodes.added} node, +${r.stats.pipes.added} pipa, +${r.stats.structures.added} bangunan, +${r.stats.tracks.added} jejak; ${r.stats.nodes.updated + r.stats.structures.updated} diperbarui`); }}>
          <div className="font-semibold text-[13px] text-aqua-800">Gabungkan ke proyek ini</div><div className="text-[12px] text-slate-500">Untuk hasil survei dari HP: titik baru ditambahkan, titik yang sama (dari salinan proyek ini) diperbarui.</div></button>
        <button type="button" className="w-full text-left rounded-md border border-line hover:border-aqua-400 p-3" onClick={() => { stopRec(); setActiveNode(null); setProject(normalizeProject(pendingLoad.data), { noStamp: true }); setSelection(null); setToast(`Proyek "${pendingLoad.name}" dimuat`); setPendingLoad(null); }}>
          <div className="font-semibold text-[13px]">Ganti seluruh proyek</div><div className="text-[12px] text-slate-500">Proyek saat ini diganti isi berkas (bisa dibatalkan dengan Urungkan).</div></button>
        <div className="flex justify-end"><Btn variant="outline" onClick={() => setPendingLoad(null)}>Batal</Btn></div>
      </div></div>}
    {userAdmin && <UserAdminDialog api={api} me={user} onClose={() => setUserAdmin(false)} />}
    {deviceDlg && <DeviceDialog onClose={() => setDeviceDlg(false)} install={installEvt ? install : null} shareData={shareData} />}
    {menuOpen && <div className="fixed inset-0 z-[1900] bg-black/40" onClick={() => setMenuOpen(false)}>
      <div className="absolute right-0 top-0 bottom-0 w-[86%] max-w-[340px] bg-white overflow-y-auto" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-line"><span className="font-semibold">Menu</span><button type="button" className="p-2 -mr-2" aria-label="Tutup menu" onClick={() => setMenuOpen(false)}><Icon name="X" size={20} /></button></div>
        <div className="px-4 py-3 border-b border-line space-y-2.5">
          <OrgLogos meta={project.meta} height={30} gap={10} className="flex-wrap" />
          <button type="button" onClick={() => { setMenuOpen(false); setPickOfficer({ then: null }); }} className="w-full flex items-center gap-2.5 rounded-md bg-ground px-3 py-2.5 text-left">
            <Icon name="UserRound" size={19} className="text-aqua-700" /><span className="flex-1 min-w-0"><span className="block text-[11px] text-slate-500">Petugas di perangkat ini</span>
            <span className="block text-[14px] font-semibold truncate">{officer ? `${officer.name}${officer.role ? ' · ' + officer.role : ''}` : 'Belum dipilih'}</span></span><span className="text-[12px] font-semibold text-aqua-700">Ganti</span></button>
        </div>
        {[
          ['Undo2', 'Urungkan', undo, !histLen],
          ['Share2', 'Bagikan data proyek (.json)', () => shareData('json')],
          ['Share2', 'Bagikan titik & jejak (.gpx)', () => shareData('gpx')],
          ['Upload', 'Muat / gabungkan .json', () => fileRef.current.click()],
          ['Download', 'Unduh .json', saveFile],
          ...(installEvt ? [['Smartphone', 'Pasang sebagai aplikasi', install]] : []),
          ['QrCode', 'Buka di perangkat lain', () => setDeviceDlg(true)],
          ...(user.admin ? [['UserRound', 'Kelola pengguna', () => setUserAdmin(true)]] : []),
          ['Building2', 'Data proyek', () => setDialog(true)],
          ['FileText', 'Cetak laporan', () => setPrintMode('report')],
          ['Printer', 'Cetak DED', () => setPrintMode('ded')],
          ['BookOpen', 'Muat proyek contoh', () => setConfirm({ text: 'Muat ulang Proyek Contoh desa? Proyek saat ini akan diganti.', yes: () => { stopRec(); setActiveNode(null); setProject(createExampleProject(), { noStamp: true }); setSelection(null); } })],
          ['X', `Keluar (${user.email})`, logout],
          ['FilePlus2', 'Proyek baru (kosong)', () => setConfirm({ text: 'Buat proyek baru yang kosong? Proyek saat ini akan diganti (simpan dulu ke .json bila perlu).', yes: () => { stopRec(); setActiveNode(null); setProject(createEmptyProject(), { noStamp: true }); setSelection(null); setTab('map'); } })],
        ].map(([ic, l, fn, dis], i) => <button key={i} type="button" disabled={dis} onClick={() => { setMenuOpen(false); fn(); }} className="w-full flex items-center gap-3 px-4 py-3.5 text-[14px] text-left border-b border-line/60 disabled:opacity-40 active:bg-slate-50"><Icon name={ic} size={19} className="text-aqua-700" />{l}</button>)}
        <p className="px-4 py-3 text-[11px] text-slate-500">{savedAt instanceof Date ? `Tersimpan otomatis di perangkat ini ${savedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}` : ''}</p>
      </div></div>}
    {coordTab && <CoordDialog tab={coordTab} setTab={setCoordTab} onClose={() => setCoordTab(null)} project={project} setProject={setProject} field={field} setSelection={setSelection} toast={setToast} />}
    {dialog && <ProjectDialog project={project} setProject={setProject} onClose={() => setDialog(false)} officerId={officerId} setOfficerId={setOfficerId} />}
    {pickOfficer && <OfficerPicker project={project} setProject={setProject} officerId={officerId} onCancel={() => setPickOfficer(null)}
      onPick={(m) => { setOfficerId(m.id); officerRef.current = m; const fn = pickOfficer.then; setPickOfficer(null); setToast(`Petugas aktif: ${m.name}`); fn && fn(); }} />}
    {confirm && <ConfirmDialog text={confirm.text} onNo={() => setConfirm(null)} onYes={() => { confirm.yes(); setConfirm(null); }} />}
    {toast && <div className="fixed bottom-20 lg:bottom-12 max-w-[92vw] text-center left-1/2 -translate-x-1/2 z-[2200] bg-deep text-white text-[13px] rounded-md px-4 py-2 shadow-lg">{toast}</div>}
    <div id="print-root">{printMode && <PrintRoot mode={printMode} project={project} hyd={hyd} boq={boq} rab={rab} />}</div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
