  const gps = useGeolocation();
  const [rec, setRec] = useState(null);
  const [follow, setFollow] = useState(true);
  const [focus, setFocus] = useState(null);
  const [coordTab, setCoordTab] = useState(null);
  const [elevStatus, setElevStatus] = useState({ state: 'idle', pending: 0 });
  const [elevRetry, setElevRetry] = useState(0);
  const mobile = useMedia('(max-width: 1023px)');
  const [menuOpen, setMenuOpen] = useState(false);
  const [deviceDlg, setDeviceDlg] = useState(false);
  const [pendingLoad, setPendingLoad] = useState(null);
  const [installEvt, setInstallEvt] = useState(null);
  useEffect(() => { const h = (e) => { e.preventDefault(); setInstallEvt(e); }; window.addEventListener('beforeinstallprompt', h); return () => window.removeEventListener('beforeinstallprompt', h); }, []);
  const install = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} setInstallEvt(null); };
  const elevBusy = useRef(false); const bufRef = useRef([]); const lastPtRef = useRef(null); const wakeRef = useRef(null);

  // Menambah node/bangunan; dipakai alat gambar, GPS, dan input koordinat
  const createPoint = useCallback((ll, kind, opt = {}) => {
    const s = projectRef.current.settings; const pf = prefsRef.current;
    const isSt = String(kind).startsWith('st:'); const id = uid(isSt ? 's' : 'n');
    const gpsElev = opt.alt != null && s.elevSource === 'gps' ? opt.alt + (+s.geoidOffset || 0) : null;
    const explicit = opt.elev !== null && opt.elev !== undefined && opt.elev !== '' && isFinite(opt.elev);
    const row = { id, lat: ll.lat, lng: ll.lng, kind, label: opt.label, demand: opt.demand, auto: opt.auto,
      elev: explicit ? +opt.elev : gpsElev, elevSrc: explicit ? 'manual' : 'gps' };
    const connect = !isSt && !!opt.connect; const from = connect ? activeRef.current : null;
    setProject(p => addPoints(p, [row], { connect, connectFrom: from, material: pf.material, diameter: pf.diameter }).project);
    if (!isSt && (connect || opt.chain)) setActiveNode(id);
    return id;
  }, []);
  const startRec = () => {
    if (!gps.watching) gps.start();
    const t = { id: uid('t'), name: 'Jejak ' + new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }), points: [] };
    setProject(p => ({ ...p, tracks: [...(p.tracks || []), t] })); setRec({ trackId: t.id }); lastPtRef.current = null; bufRef.current = [];
    try { navigator.wakeLock?.request('screen').then(w => { wakeRef.current = w; }).catch(() => {}); } catch (e) {}
  };
  const stopRec = () => { setRec(null); try { wakeRef.current?.release(); } catch (e) {} wakeRef.current = null; };
  const markHere = (kind) => {
    const pos = gps.pos; if (!pos) { setToast('Menunggu posisi GPS…'); return; }
    const isSt = kind.startsWith('st:');
    const id = createPoint(pos, kind, { connect: !isSt && prefs.connectGps, chain: !isSt, alt: pos.alt });
    bufRef.current = []; setSelection({ kind: isSt ? 'struct' : 'node', id });
    setToast(`${KIND_LABEL(kind)} ditandai${pos.acc > project.settings.gpsMaxAcc ? `, tetapi akurasi GPS rendah (±${Math.round(pos.acc)} m)` : ` (±${Math.round(pos.acc)} m)`}`);
  };
  // Rekam jejak + node otomatis di belokan
  useEffect(() => {
    const pos = gps.pos; if (!pos || !rec) return;
    const s = projectRef.current.settings;
    if (pos.acc > (+s.gpsMaxAcc || 20)) return;
    const last = lastPtRef.current;
    if (last && haversine({ lat: last[0], lng: last[1] }, pos) < Math.max(1, +s.gpsMinStep || 3)) return;
    const pt = [+pos.lat.toFixed(7), +pos.lng.toFixed(7), pos.alt != null ? round2(pos.alt) : null, Math.round(pos.acc), pos.t || Date.now()];
    lastPtRef.current = pt;
    patchProject(p => ({ ...p, tracks: (p.tracks || []).map(t => t.id === rec.trackId ? { ...t, points: [...t.points, pt] } : t) }));
    if (!s.autoNodes || !activeRef.current) { bufRef.current = []; return; }
    const chain = projectRef.current.nodes.find(n => n.id === activeRef.current); if (!chain) { bufRef.current = []; return; }
    const buf = [...bufRef.current, pt]; bufRef.current = buf;
    const P = makeProjector(chain.lat, chain.lng); const xy = buf.map(b => P.toXY(b[0], b[1])); const c = xy[xy.length - 1];
    let md = 0, mi = -1; for (let i = 0; i < xy.length - 1; i++) { const d = segDist(xy[i], { x: 0, y: 0 }, c); if (d > md) { md = d; mi = i; } }
    if (md > (+s.autoTol || 6) && mi >= 0) { const v = buf[mi]; createPoint({ lat: v[0], lng: v[1] }, 'junction', { connect: true, auto: true, alt: v[2] }); bufRef.current = buf.slice(mi + 1); }
    else if (Math.hypot(c.x, c.y) >= (+s.autoMaxSeg || 100)) { createPoint({ lat: pt[0], lng: pt[1] }, 'junction', { connect: true, auto: true, alt: pt[2] }); bufRef.current = []; }
  }, [gps.pos]);
  // Elevasi otomatis (DEM) untuk node & bangunan yang belum punya elevasi pada koordinatnya
  useEffect(() => {
    if (project.settings.elevSource === 'off') { setElevStatus({ state: 'idle', pending: 0 }); return; }
    const need = [];
    project.nodes.forEach(n => { if (n.elevAuto && n.elevKey !== demKey(n.lat, n.lng)) need.push({ kind: 'n', id: n.id, lat: n.lat, lng: n.lng }); });
    (project.structures || []).forEach(st => { if (!st.nodeId && st.elevAuto && st.lat != null && st.elevKey !== demKey(st.lat, st.lng)) need.push({ kind: 's', id: st.id, lat: st.lat, lng: st.lng }); });
    if (!need.length) { setElevStatus(s => s.state === 'loading' || s.pending ? { state: 'ok', pending: 0, at: new Date() } : s); return; }
    const wait = Math.max(600, DEM.failUntil - Date.now());
    if (DEM.failUntil > Date.now()) setElevStatus(s => ({ ...s, state: 'error', pending: need.length }));
    const t = setTimeout(async () => {
      if (elevBusy.current) return; elevBusy.current = true; setElevStatus({ state: 'loading', pending: need.length });
      try {
        const vals = await fetchDem(need); DEM.failUntil = 0;
        const map = new Map(need.map((q, i) => [q.kind + q.id, { v: vals[i], key: demKey(q.lat, q.lng) }]));
        patchProject(p => ({ ...p,
          nodes: p.nodes.map(n => { const r = map.get('n' + n.id); return r && n.elevAuto && demKey(n.lat, n.lng) === r.key && isFinite(r.v) ? { ...n, elev: round2(r.v), elevSrc: 'dem', elevKey: r.key } : n; }),
          structures: (p.structures || []).map(x => { const r = map.get('s' + x.id); return r && x.elevAuto && x.lat != null && demKey(x.lat, x.lng) === r.key && isFinite(r.v) ? { ...x, elevSrc: 'dem', elevKey: r.key, params: { ...x.params, elev: round2(r.v) } } : x; }) }));
        setElevStatus({ state: 'ok', pending: 0, at: new Date() });
      } catch (e) {
        DEM.failUntil = Date.now() + 30000; setElevStatus({ state: 'error', pending: need.length });
        setTimeout(() => setElevRetry(x => x + 1), 30500);
      } finally { elevBusy.current = false; }
    }, wait);
    return () => clearTimeout(t);
  }, [project.nodes, project.structures, project.settings.elevSource, elevRetry]);
  const openDed = (id) => { setProject(p => ({ ...p, ded: { ...p.ded, sheet: 'st:' + id } })); setTab('ded'); };
  const fileBase = () => (project.meta.name || 'proyek').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 50);
  const shareData = async (kind) => {
    const isGpx = kind === 'gpx'; const name = fileBase() + (isGpx ? '.gpx' : '.json');
    const text = isGpx ? buildGpx(project) : JSON.stringify(project, null, 2);
    try {
      const file = new File([text], name, { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: project.meta.name, text: 'Data survei TirtaPlan' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    downloadText(name, text, isGpx ? 'application/gpx+xml' : 'application/json');
    setToast('Perangkat ini tidak mendukung menu Bagikan; berkas diunduh.');
  };
  const field = { mobile, elevStatus, prefs, setPrefs, activeNode, setActiveNode, createPoint, gps, rec, startRec, stopRec, markHere, follow, setFollow, focus, setFocus, openCoord: setCoordTab, openDed };

  const hyd = useMemo(() => computeHydraulics(project), [project]);
  const boq = useMemo(() => computeBoQ(project, hyd), [project, hyd]);
  const rab = useMemo(() => buildRAB(project, boq), [project, boq]);

  useEffect(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, []);
  useEffect(() => { const t = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(project)); setSavedAt(new Date()); } catch (e) { setSavedAt('err'); } }, 500); return () => clearTimeout(t); }, [project]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2600); return () => clearTimeout(t); }, [toast]);
  useEffect(() => {
    const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); } };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  });
  useEffect(() => {
    if (!printMode) return;
    const paper = project.ded.paper === 'A4' ? 'A4' : 'A3';
    const st = document.createElement('style'); st.id = 'tp-page';
    st.textContent = `@page { size: A4 portrait; margin: 14mm 12mm; } @page sheet { size: ${paper} landscape; margin: 6mm; }`;
    document.head.appendChild(st);
    const done = () => { setPrintMode(null); st.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    const t = setTimeout(() => window.print(), 400);
    return () => clearTimeout(t);
  }, [printMode]);

  const saveFile = () => {
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (project.meta.name || 'proyek').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setToast('Proyek disimpan sebagai berkas .json');
  };
  const loadFile = (e) => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const data = JSON.parse(r.result); if (!Array.isArray(data.nodes)) throw new Error(); setPendingLoad({ data, name: f.name }); } catch (err) { setToast('Berkas tidak valid: pastikan ini berkas .json dari TirtaPlan'); } };
    r.readAsText(f); e.target.value = '';
  };

  const tabs = [
    { id: 'map', n: '1', label: 'Pemetaan & Asesmen', short: 'Peta', icon: 'Map' },
    { id: 'hyd', n: '2', label: 'Analisis Hidrolis', short: 'Hidrolis', icon: 'Gauge' },
    { id: 'boq', n: '3', label: 'BoQ & RAB', short: 'RAB', icon: 'Calculator' },
    { id: 'ded', n: '4', label: 'DED & Gambar Teknik', short: 'DED', icon: 'DraftingCompass' },
  ];
  const s = project.settings;
  const nCrit = hyd.warnings.filter(w => w.level === 'high').length;

  return <>
    <div id="app-shell" className="h-full flex flex-col">
      {mobile ? <header className="bg-deep text-white shrink-0" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div className="flex items-center gap-2 px-3 py-2">
          <div className="w-8 h-8 rounded-md bg-aqua-500 flex items-center justify-center shrink-0"><Icon name="Droplets" size={18} /></div>
          <button type="button" onClick={() => setDialog(true)} className="min-w-0 flex-1 text-left">
            <div className="text-[10px] tracking-[0.14em] uppercase text-aqua-200 font-semibold">TirtaPlan Studio</div>
            <div className="text-[13px] font-semibold truncate">{project.meta.name}</div></button>
          {rec && <span className="flex items-center gap-1 text-[10px] font-bold rounded-full px-2 py-0.5 bg-red-500"><span className="tp-rec w-1.5 h-1.5 rounded-full bg-white" />REC</span>}
          <button type="button" disabled={!histLen} onClick={undo} className="p-2 rounded disabled:opacity-30" aria-label="Urungkan"><Icon name="Undo2" size={20} /></button>
          <button type="button" onClick={() => setMenuOpen(true)} className="p-2 -mr-1 rounded" aria-label="Menu"><Icon name="Menu" size={22} /></button>
        </div>
        <nav className="flex">
          {tabs.map(t => <button key={t.id} type="button" onClick={() => setTab(t.id)}
            className={`flex-1 flex items-center justify-center gap-1 py-2 text-[12px] font-semibold border-b-2 ${tab === t.id ? 'border-aqua-400 text-white bg-white/5' : 'border-transparent text-slate-300'}`}>
            <Icon name={t.icon} size={14} />{t.short}{t.id === 'hyd' && hyd.warnings.length > 0 && <span className={`text-[9px] font-bold rounded-full px-1 ${nCrit ? 'bg-red-500' : 'bg-amber-400 text-ink'}`}>{hyd.warnings.length}</span>}</button>)}
        </nav>
      </header> : <header className="bg-deep text-white shrink-0">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-8 h-8 rounded-md bg-aqua-500 flex items-center justify-center shrink-0"><Icon name="Droplets" size={18} /></div>
            <div className="min-w-0">
              <div className="text-[11px] tracking-[0.14em] uppercase text-aqua-200 font-semibold">TirtaPlan Studio</div>
              <button type="button" onClick={() => setDialog(true)} className="block text-[14px] font-semibold truncate max-w-[52vw] lg:max-w-[560px] hover:underline text-left" title="Ubah data proyek">{project.meta.name}</button>
            </div>
          </div>
          <div className="flex-1" />
          <div className="flex flex-wrap items-center gap-1">
            <Btn variant="dark" icon="FilePlus2" onClick={() => setConfirm({ text: 'Buat proyek baru yang kosong? Proyek saat ini akan diganti (simpan dulu ke .json bila perlu).', yes: () => { stopRec(); setActiveNode(null); setProject(createEmptyProject()); setSelection(null); setTab('map'); } })}>Baru</Btn>
            <Btn variant="dark" icon="BookOpen" onClick={() => setConfirm({ text: 'Muat ulang Proyek Contoh desa? Proyek saat ini akan diganti.', yes: () => { stopRec(); setActiveNode(null); setProject(createExampleProject()); setSelection(null); } })}>Contoh</Btn>
            <Btn variant="dark" icon="Undo2" disabled={!histLen} onClick={undo} title="Urungkan (Ctrl+Z)">Urungkan</Btn>
            <span className="w-px h-6 bg-white/15 mx-1" />
            <Btn variant="dark" icon="Download" onClick={saveFile} title="Simpan proyek ke berkas .json (Ctrl+S)">Simpan .json</Btn>
            <Btn variant="dark" icon="Upload" onClick={() => fileRef.current.click()}>Muat .json</Btn>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={loadFile} />
            <Btn variant="dark" icon="Smartphone" onClick={() => setDeviceDlg(true)} title="Buka aplikasi di HP / tablet">Buka di HP</Btn>
            <span className="w-px h-6 bg-white/15 mx-1" />
            <Btn variant="dark" icon="FileText" onClick={() => setPrintMode('report')}>Cetak laporan</Btn>
            <Btn variant="dark" icon="Printer" onClick={() => setPrintMode('ded')}>Cetak DED</Btn>
          </div>
        </div>
        <nav className="flex overflow-x-auto px-2">
          {tabs.map(t => <button key={t.id} type="button" onClick={() => setTab(t.id)}
            className={`flex items-center gap-2 px-4 py-2.5 text-[13px] font-medium whitespace-nowrap border-b-2 ${tab === t.id ? 'border-aqua-400 text-white bg-white/5' : 'border-transparent text-slate-300 hover:text-white'}`}>
            <span className={`font-mono text-[11px] w-5 h-5 rounded flex items-center justify-center ${tab === t.id ? 'bg-aqua-500 text-white' : 'bg-white/10'}`}>{t.n}</span><Icon name={t.icon} size={15} />{t.label}
            {t.id === 'map' && rec && <span className="ml-1 flex items-center gap-1 text-[10px] font-bold rounded-full px-1.5 bg-red-500 text-white"><span className="tp-rec w-1.5 h-1.5 rounded-full bg-white" />REC</span>}
            {t.id === 'hyd' && hyd.warnings.length > 0 && <span className={`ml-1 text-[10px] font-bold rounded-full px-1.5 ${nCrit ? 'bg-red-500' : 'bg-amber-400 text-ink'}`}>{hyd.warnings.length}</span>}
          </button>)}
        </nav>
      </header>}
      <main className="flex-1 min-h-0 relative">
        {tab === 'map' && <MapWorkspace project={project} setProject={setProject} hyd={hyd} selection={selection} setSelection={setSelection} field={field} />}
        {tab === 'hyd' && <HydraulicWorkspace project={project} setProject={setProject} hyd={hyd} setSelection={setSelection} goMap={() => setTab('map')} />}
        {tab === 'boq' && <BoqWorkspace project={project} setProject={setProject} boq={boq} rab={rab} />}
        {tab === 'ded' && <DedWorkspace project={project} setProject={setProject} hyd={hyd} boq={boq} onPrint={setPrintMode} />}
      </main>
      <footer className="shrink-0 bg-white border-t border-line px-4 py-1.5 hidden lg:flex flex-wrap items-center gap-x-5 gap-y-1 text-[12px] text-slate-600 num">
        <span className="flex items-center gap-1.5"><Icon name="Spline" size={13} />{project.nodes.length} node · {project.pipes.length} pipa · {fmt(hyd.totalLength, 1)} m</span>
        <span className="flex items-center gap-1.5"><Icon name="Droplets" size={13} />Q total {fmt(hyd.totalDemand)} L/dtk</span>
        <span className="flex items-center gap-1.5"><Icon name="Gauge" size={13} />P min {hyd.minP ? fmt(hyd.nodes[hyd.minP.id].pressure, 1) + ' mka' : '–'}</span>
        <span className="flex items-center gap-1.5"><Icon name="Calculator" size={13} />RAB {rp(rab.rounded)}</span>
        <span className="flex-1" />
        {project.settings.elevSource !== 'off' && elevStatus.state !== 'idle' && <span className="flex items-center gap-1.5">
          {elevStatus.state === 'loading' ? <><Icon name="Mountain" size={13} className="text-aqua-600" />Mengambil elevasi DEM ({elevStatus.pending} titik)…</>
            : elevStatus.state === 'error' ? <><Icon name="TriangleAlert" size={13} className="text-amber-600" />Elevasi DEM tidak terjangkau; {elevStatus.pending} titik memakai perkiraan <button type="button" className="font-semibold text-aqua-700 hover:underline" onClick={() => { DEM.failUntil = 0; setElevRetry(x => x + 1); }}>Coba lagi</button></>
            : <><Icon name="Mountain" size={13} className="text-green-600" />Elevasi DEM terbaru</>}</span>}
        <span className="flex items-center gap-1.5">{savedAt === 'err' ? <><Icon name="TriangleAlert" size={13} className="text-amber-600" />Penyimpanan otomatis tidak tersedia di browser ini</> : savedAt ? <><Icon name="CircleCheck" size={13} className="text-green-600" />Tersimpan otomatis {savedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</> : 'Menyimpan…'}</span>
      </footer>
    </div>
    {pendingLoad && <div className="fixed inset-0 z-[2100] bg-black/40 flex items-center justify-center p-4" onClick={() => setPendingLoad(null)}>
      <div className="bg-white rounded-lg w-full max-w-md p-5 space-y-3" onClick={e => e.stopPropagation()}>
        <h2 className="font-semibold text-[15px]">Muat "{pendingLoad.name}"</h2>
        <p className="text-[13px] text-slate-600">Berkas berisi {pendingLoad.data.nodes.length} node, {(pendingLoad.data.pipes || []).length} pipa, {(pendingLoad.data.structures || []).length} bangunan, dan {(pendingLoad.data.tracks || []).length} jejak GPS.</p>
        <button type="button" className="w-full text-left rounded-md border border-line hover:border-aqua-400 p-3" onClick={() => { const r = mergeProject(project, pendingLoad.data); setProject(r.project); setPendingLoad(null);
          setToast(`Digabung: +${r.stats.nodes.added} node, +${r.stats.pipes.added} pipa, +${r.stats.structures.added} bangunan, +${r.stats.tracks.added} jejak; ${r.stats.nodes.updated + r.stats.structures.updated} diperbarui`); }}>
          <div className="font-semibold text-[13px] text-aqua-800">Gabungkan ke proyek ini</div><div className="text-[12px] text-slate-500">Untuk hasil survei dari HP: titik baru ditambahkan, titik yang sama (dari salinan proyek ini) diperbarui.</div></button>
        <button type="button" className="w-full text-left rounded-md border border-line hover:border-aqua-400 p-3" onClick={() => { stopRec(); setActiveNode(null); setProject(normalizeProject(pendingLoad.data)); setSelection(null); setToast(`Proyek "${pendingLoad.name}" dimuat`); setPendingLoad(null); }}>
          <div className="font-semibold text-[13px]">Ganti seluruh proyek</div><div className="text-[12px] text-slate-500">Proyek saat ini diganti isi berkas (bisa dibatalkan dengan Urungkan).</div></button>
        <div className="flex justify-end"><Btn variant="outline" onClick={() => setPendingLoad(null)}>Batal</Btn></div>
      </div></div>}
    {deviceDlg && <DeviceDialog onClose={() => setDeviceDlg(false)} install={installEvt ? install : null} shareData={shareData} />}
    {menuOpen && <div className="fixed inset-0 z-[1900] bg-black/40" onClick={() => setMenuOpen(false)}>
      <div className="absolute right-0 top-0 bottom-0 w-[86%] max-w-[340px] bg-white overflow-y-auto" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-line"><span className="font-semibold">Menu</span><button type="button" className="p-2 -mr-2" aria-label="Tutup menu" onClick={() => setMenuOpen(false)}><Icon name="X" size={20} /></button></div>
        {[
          ['Undo2', 'Urungkan', undo, !histLen],
          ['Share2', 'Bagikan data proyek (.json)', () => shareData('json')],
          ['Share2', 'Bagikan titik & jejak (.gpx)', () => shareData('gpx')],
          ['Upload', 'Muat / gabungkan .json', () => fileRef.current.click()],
          ['Download', 'Unduh .json', saveFile],
          ...(installEvt ? [['Smartphone', 'Pasang sebagai aplikasi', install]] : []),
          ['QrCode', 'Buka di perangkat lain', () => setDeviceDlg(true)],
          ['Building2', 'Data proyek', () => setDialog(true)],
          ['FileText', 'Cetak laporan', () => setPrintMode('report')],
          ['Printer', 'Cetak DED', () => setPrintMode('ded')],
          ['BookOpen', 'Muat proyek contoh', () => setConfirm({ text: 'Muat ulang Proyek Contoh desa? Proyek saat ini akan diganti.', yes: () => { stopRec(); setActiveNode(null); setProject(createExampleProject()); setSelection(null); } })],
          ['FilePlus2', 'Proyek baru (kosong)', () => setConfirm({ text: 'Buat proyek baru yang kosong? Proyek saat ini akan diganti (simpan dulu ke .json bila perlu).', yes: () => { stopRec(); setActiveNode(null); setProject(createEmptyProject()); setSelection(null); setTab('map'); } })],
        ].map(([ic, l, fn, dis], i) => <button key={i} type="button" disabled={dis} onClick={() => { setMenuOpen(false); fn(); }} className="w-full flex items-center gap-3 px-4 py-3.5 text-[14px] text-left border-b border-line/60 disabled:opacity-40 active:bg-slate-50"><Icon name={ic} size={19} className="text-aqua-700" />{l}</button>)}
        <p className="px-4 py-3 text-[11px] text-slate-500">{savedAt instanceof Date ? `Tersimpan otomatis di perangkat ini ${savedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}` : ''}</p>
      </div></div>}
    {coordTab && <CoordDialog tab={coordTab} setTab={setCoordTab} onClose={() => setCoordTab(null)} project={project} setProject={setProject} field={field} setSelection={setSelection} toast={setToast} />}
    {dialog && <ProjectDialog project={project} setProject={setProject} onClose={() => setDialog(false)} />}
    {confirm && <ConfirmDialog text={confirm.text} onNo={() => setConfirm(null)} onYes={() => { confirm.yes(); setConfirm(null); }} />}
    {toast && <div className="fixed bottom-20 lg:bottom-12 max-w-[92vw] text-center left-1/2 -translate-x-1/2 z-[2200] bg-deep text-white text-[13px] rounded-md px-4 py-2 shadow-lg">{toast}</div>}
    <div id="print-root">{printMode && <PrintRoot mode={printMode} project={project} hyd={hyd} boq={boq} rab={rab} />}</div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
